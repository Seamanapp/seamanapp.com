<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">

<meta name="apple-mobile-web-app-title" content="Family Budget">
<title>Family Freedom Budget</title>
<!--
  Family Freedom Budget — a get-out-of-debt plan for a family of four living on
  irregular business income (no fixed salary).

  PRIVATE BY DESIGN. Everything the family types is kept in this browser's
  localStorage and nowhere else: no server, no analytics, no Meta pixel
  (inject_pixel.mjs skips budget/ on purpose). "Export backup" is the only way
  data leaves the device, and it goes to a file the family keeps.

  The method, in one breath:
    1. Every peso the businesses earn lands in a HOLDING TANK, never straight
       into spending. Tax and business-reinvest shares are carved off first.
    2. The family pays itself ONE steady monthly SALARY out of the tank, sized
       from the lean months (lowest recent month, or 80% of the average).
    3. The budget spends that salary to zero; whatever is left, plus any
       surplus above a one-month buffer in the tank, goes to the current step
       of the roadmap: starter emergency fund -> kill debt (snowball or
       avalanche) -> one-month buffer -> full emergency fund -> protect the
       family -> kids' education + retirement.
-->
<style>
:root{
  --bg:#f5f3ee; --card:#ffffff; --ink:#1b2422; --muted:#5f6d69; --line:#e3ded3;
  --brand:#0f6e66; --brand-ink:#ffffff; --brand-soft:#dcefeb;
  --good:#1f8a4c; --good-soft:#e1f3e8; --warn:#b26a00; --warn-soft:#fbefd9;
  --bad:#c0392b; --bad-soft:#fae3df; --gold:#c8911b;
  --bar:#e9e5dc; --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -16px rgba(0,0,0,.25);
  --radius:14px;
  /* categorical slots (validated palette, fixed order) + neutral "other" */
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#4a3aa7; --c0:#9c988f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1514; --card:#172120; --ink:#e7efec; --muted:#9aaba6; --line:#26332f;
    --brand:#3cbfb0; --brand-ink:#06201d; --brand-soft:#16332f;
    --good:#4cc47f; --good-soft:#15301f; --warn:#f0b04a; --warn-soft:#3a2c12;
    --bad:#ff7a6b; --bad-soft:#3b1d19; --gold:#f0c35a;
    --bar:#24302d; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -16px rgba(0,0,0,.6);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c0:#6d6b66;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1514; --card:#172120; --ink:#e7efec; --muted:#9aaba6; --line:#26332f;
  --brand:#3cbfb0; --brand-ink:#06201d; --brand-soft:#16332f;
  --good:#4cc47f; --good-soft:#15301f; --warn:#f0b04a; --warn-soft:#3a2c12;
  --bad:#ff7a6b; --bad-soft:#3b1d19; --gold:#f0c35a;
  --bar:#24302d; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -16px rgba(0,0,0,.6);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c0:#6d6b66;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3{line-height:1.2;margin:0}
h2{font-size:18px}
h3{font-size:15px}
p{margin:.4em 0}
small,.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
header.top{background:var(--brand);color:var(--brand-ink);padding:12px 16px calc(12px);padding-top:max(12px,env(safe-area-inset-top))}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .wrap > div:first-child{min-width:0}
header.top .sub{opacity:.85;font-size:13px}
.hdr-step{background:rgba(255,255,255,.18);color:inherit;border:0;border-radius:99px;padding:4px 12px;min-height:32px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
.wrap{max-width:880px;margin:0 auto}
main{padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.card > h2{margin-bottom:8px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:420px){.g2.stack{grid-template-columns:1fr} .g3{gap:8px} .g3 .stat{padding:10px 8px} .g3 .stat .v,.g3 .v{font-size:17px} .g3 .stat .k{font-size:10.5px}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .h{font-size:12px;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--brand-soft);color:var(--brand)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.note{border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px;background:var(--brand-soft)}
.note.warn{background:var(--warn-soft)}
.note.bad{background:var(--bad-soft)}
.note.good{background:var(--good-soft)}
.bar{height:10px;background:var(--bar);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s}
.bar.good > i{background:var(--good)} .bar.warn > i{background:var(--warn)} .bar.bad > i{background:var(--bad)}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:10px;cursor:pointer;min-height:40px}
a.btn{display:inline-block;text-decoration:none}
a.btn.primary,button.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
button.danger{color:var(--bad)}
button.link{border:0;background:none;padding:4px 6px;min-height:0;color:var(--brand)}
button.icon{padding:4px 9px;min-height:32px;font-size:13px}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.spacer{flex:1}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
label.f > span{display:block;margin-bottom:3px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:8px 10px;width:100%;min-height:40px}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--brand)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
tr.group td{background:var(--bg);font-weight:700;font-size:13px}
td input{min-height:34px;padding:5px 8px}
td input.amt{max-width:120px;text-align:right}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav.tabs .in{display:flex;max-width:880px;width:100%}
nav.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:10.5px;font-weight:600;color:var(--muted);padding:6px 0;min-height:52px;min-width:0;border-radius:10px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--brand);background:var(--brand-soft)}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps .n{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;
  background:var(--bar);color:var(--muted)}
.steps li.done .n{background:var(--good);color:#fff}
.steps li.now .n{background:var(--brand);color:var(--brand-ink)}
.steps li.now{background:linear-gradient(90deg,var(--brand-soft),transparent);margin:0 -16px;padding:12px 16px}
.steps .body{flex:1;min-width:0}
.chart{display:flex;align-items:flex-end;gap:4px;height:130px;padding-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end;min-width:0}
.chart .col i{display:block;width:100%;max-width:34px;background:var(--brand);border-radius:6px 6px 2px 2px;min-height:2px}
.chart .col i.low{background:var(--warn)}
.chart .col span{font-size:10px;color:var(--muted);white-space:nowrap}
.chart-wrap{position:relative}
.chart-line{position:absolute;left:0;right:0;border-top:2px dashed var(--good);pointer-events:none}
.chart-line b{position:absolute;right:0;top:-18px;font-size:11px;color:var(--good);background:var(--card);padding:0 4px}
.hero{display:flex;gap:14px;align-items:center}
.ring{flex:none;width:72px;height:72px}
details{margin-top:6px}
summary{cursor:pointer;font-weight:600;color:var(--brand)}
.hidden{display:none!important}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:18px;
  width:min(440px,calc(100vw - 32px));box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input{margin-top:2px;flex:none}
/* visual layer */
.big{font-size:22px;line-height:1}
.k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.card.tight{padding:12px;margin:0}
.card.tight .v{margin:4px 0 8px}
button.sm{min-height:34px;padding:6px 12px;font-size:14px}
button.stat{display:block;text-align:left;width:100%;font-weight:400;cursor:pointer}
button.stat .bar{margin:6px 0 4px;height:6px}
.hero .icon{font-size:22px;padding:2px 12px}
.dots{display:flex;gap:6px;margin-top:12px}
.dots i{flex:1;height:6px;border-radius:99px;background:var(--bar)}
.dots i.done{background:var(--good)} .dots i.now{background:var(--brand)}
.flow{display:flex;align-items:center;gap:2px;margin:0 0 14px}
.flow .node{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.flow .node b{font-size:14px} .flow .node small{font-size:11px;color:var(--muted)}
.flow .arr{color:var(--muted);font-weight:700}
.starts button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px}
details.info{margin:4px 2px 16px}
details.info summary{font-size:14px;list-style:none;padding:6px 0}
details.info summary::-webkit-details-marker{display:none}
.info-b{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.info-b ul,.info-b ol{margin:0;padding-left:20px}
details.why summary{font-size:12px;font-weight:600;color:var(--muted)}
details.why p{font-size:14px;color:var(--muted)}
.chart-svg{width:100%;height:auto;display:block;overflow:visible}
.chart-svg .axis{stroke:var(--line);stroke-width:1}
.chart-svg .tl{font-size:10px;fill:var(--muted)}
.chart-svg .tv{font-size:10px;fill:var(--ink);font-weight:600}
.chart-svg .ref{stroke:var(--good);stroke-width:1.5;stroke-dasharray:4 3}
.chart-svg .tr{font-size:10px;fill:var(--good);font-weight:600}
.chart-svg .area{fill:var(--brand);opacity:.14}
.chart-svg .aline{fill:none;stroke:var(--brand);stroke-width:2;stroke-linejoin:round}
.chart-svg .xh{stroke:var(--muted);stroke-width:1}
.chart-svg .xd{fill:var(--brand);stroke:var(--card);stroke-width:2}
.chart-svg g[data-tip]:hover path{opacity:.8}
.stack{display:flex;gap:2px;height:22px;border-radius:6px;overflow:hidden;margin:8px 0 12px}
.stack i{min-width:4px;display:block}
.legend .lg{display:grid;grid-template-columns:14px 1fr auto 44px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.legend .lg:last-child{border-bottom:0}
.legend .lp{text-align:right;color:var(--muted);font-size:12px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px}
.dues{display:flex;flex-direction:column;gap:8px}
.due{display:grid;grid-template-columns:44px 1fr auto auto;gap:10px;align-items:center}
.dd{background:var(--brand-soft);color:var(--brand);border-radius:10px;text-align:center;padding:4px 0;line-height:1.1}
.dd b{display:block;font-size:18px} .dd span{font-size:10px;text-transform:uppercase;font-weight:700}
.dd.soon{background:var(--warn-soft);color:var(--warn)}
.dn{min-width:0} .dn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .dn small{color:var(--muted);font-size:12px}
.da{font-weight:700}
details.dueg summary{list-style:none;cursor:pointer}
details.dueg summary::-webkit-details-marker{display:none}
.chev{color:var(--muted);font-size:20px;width:44px;text-align:center;transition:transform .2s}
details.dueg[open] .chev{transform:rotate(90deg)}
.due.sub{margin-top:6px} .due.sub .dn b{font-weight:500}
.dn small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:4px;border-radius:12px}
.seg button{border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:14px;padding:8px 4px}
.seg button small{font-weight:400;font-size:11px;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--card);box-shadow:var(--shadow);color:var(--brand)}
.bigdate{text-align:center;margin:12px 0 4px} .bigdate small{display:block;color:var(--muted);font-size:12px}
.bigdate b{font-size:28px;color:var(--brand)}
details.grp{padding:12px 16px}
details.grp summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;font-weight:700;color:var(--ink)}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary::after{content:'›';color:var(--muted);transition:transform .2s;font-size:20px;line-height:1}
details.grp[open] summary::after{transform:rotate(90deg)}
details.grp .gn{flex:1;min-width:0} details.grp .gn small{background:var(--bar);border-radius:99px;padding:0 7px;font-size:11px;color:var(--muted)}
details.grp > .bar{margin:10px 0 4px;height:6px}
.drow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.drow.done{opacity:.55}
.dl{min-width:0} .dl b{display:block} .dl small{display:block;color:var(--muted);font-size:12px}
.dl .dnote{font-style:italic}
.dr{font-weight:600} .da2{display:flex;gap:4px}
.brow{display:grid;grid-template-columns:1fr 96px auto auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow .bname{border-color:transparent;background:transparent;padding:6px 4px;min-height:34px}
.brow .bname:focus{background:var(--bg);border-color:var(--line)}
.brow small{display:block;padding-left:4px;font-size:12px}
.brow .amt{text-align:right;min-height:36px;padding:6px 8px}
.need{display:flex;flex-direction:column;align-items:center;font-size:9px;color:var(--muted);text-transform:uppercase;gap:1px}
.need input{width:18px;height:18px}
details.dueg summary{color:var(--ink)}
.seg.mini{display:inline-grid;padding:3px;gap:3px} .seg.mini button{padding:4px 12px;min-height:30px;font-size:13px}
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px} .calnav b{font-size:16px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.calgrid .wd{text-align:center;font-size:11px;color:var(--muted);font-weight:700;padding:2px 0}
.cd{min-height:54px;padding:3px 1px;border-radius:8px;border:1px solid transparent;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:400}
.cd .cdn{font-size:12px;color:var(--muted)}
.cd.has{background:var(--brand-soft);cursor:pointer} .cd.has .cdn{color:var(--ink);font-weight:700}
.cd .cda{font-size:10px;font-weight:700;color:var(--brand);letter-spacing:-.02em}
.cd .cdd{display:flex;gap:2px} .cd .cdd i{width:5px;height:5px;border-radius:50%}
.cd.paid{background:var(--good-soft)} .cd.paid .cda{color:var(--good)}
.cd.today{border-color:var(--ink)} .cd.sel{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.calday{background:var(--bg);border-radius:12px;padding:10px;margin-top:8px}
.calday .due{grid-template-columns:12px 1fr auto auto}
.yeargrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ym{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 10px;min-height:64px;font-weight:400;text-align:left}
.ym .heat{position:absolute;inset:0;background:var(--brand);pointer-events:none}
.ym > *:not(.heat){position:relative}
.ym .ymn{font-size:12px;font-weight:700;color:var(--muted)} .ym b{font-size:15px} .ym small{font-size:11px;color:var(--muted)}
.ym.today{border-color:var(--ink)}
.ym .ymbar{position:absolute;left:0;bottom:0;height:4px;background:var(--brand);border-radius:0 2px 0 0}
.slices{display:flex;gap:2px;height:10px;margin:10px 0 0}
.slices i{flex:1;background:var(--bar);border-radius:2px;min-width:2px}
.slices i.on{background:var(--good)}
.mini-sl{display:flex;align-items:center;gap:6px;margin-top:4px} .mini-sl .slices{flex:1;height:6px;margin:0}
.mini-sl small{flex:none;font-size:11px;color:var(--muted)}
details.mbm > summary{margin-top:6px}
.sched{margin-top:8px;font-size:13px}
.sched .sh{display:grid;grid-template-columns:52px 1fr 1.6fr 56px;gap:6px;padding:7px 2px;border-bottom:1px solid var(--line);align-items:center}
.sched > .sh{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.sched .sh .r{text-align:right} .sched .sh span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.sm-row > summary{list-style:none;cursor:pointer;color:var(--ink);font-weight:400}
details.sm-row > summary::-webkit-details-marker{display:none}
details.sm-row[open] > summary{background:var(--brand-soft);border-radius:8px}
.sm-b{padding:8px 6px 10px;border-bottom:1px solid var(--line)} .sm-b .row{padding:2px 0} .sub-t{border-top:1px dashed var(--line);margin-top:4px;padding-top:4px}
.neg{color:var(--bad)!important}
.wf{margin-top:4px}
.wfr{display:flex;justify-content:space-between;gap:8px;padding:5px 0;font-size:14px;border-bottom:1px solid var(--line)}
.wfr > .num{white-space:nowrap}

<script>
(function(){
'use strict';

/* ------------------------------------------------------------------ state */

var KEY = 'familyFreedomBudget.v1';
var uid = function(){ return Math.random().toString(36).slice(2,10); };

function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function pad(n){ return (n<10?'0':'')+n; }
function monthKey(iso){ return String(iso).slice(0,7); }
function shortDate(iso){ return monthLabel(monthKey(iso)).split(' ')[0]+' '+(+String(iso).slice(8,10)); }
function thisMonth(){ return monthKey(todayISO()); }
function addMonths(mk, n){ var y=+mk.slice(0,4), m=+mk.slice(5,7)-1+n; y+=Math.floor(m/12); m=((m%12)+12)%12; return y+'-'+pad(m+1); }
function monthLabel(mk, long){
  var names=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var m=+mk.slice(5,7)-1; return names[m]+(long?' '+mk.slice(0,4):" '"+mk.slice(2,4));
}

// Budget categories tuned for a Filipino family of four with a newborn and a
// preschooler. Amounts start at zero: the family fills in their own numbers.
function defaultBudget(){
  var c=function(group,name,essential){ return {id:uid(),group:group,name:name,amount:0,essential:essential!==false}; };
  return [
    c('Home','Rent / house amortization'), c('Home','Electricity'), c('Home','Water'),
    c('Home','Internet & mobile load'), c('Home','LPG / cooking gas'), c('Home','House help / laundry', false),
    c('Food','Groceries & palengke'), c('Food','Rice'), c('Food','Drinking water'),
    c('Baby (newborn)','Formula / milk'), c('Baby (newborn)','Diapers & wipes'),
    c('Baby (newborn)','Pedia check-ups & vaccines'), c('Baby (newborn)','Baby clothes & essentials'),
    c('Kuya (4 yrs old)','Preschool tuition & supplies'), c('Kuya (4 yrs old)','Milk, snacks & baon'),
    c('Kuya (4 yrs old)','Clothes & shoes'),
  ].concat(parentLines('Daddy'), parentLines('Mommy'), [
    c('Transport','Fuel / fare'), c('Transport','Vehicle maintenance & registration'),
    c('Health & protection','PhilHealth (both parents)'), c('Health & protection','SSS voluntary (both parents)'),
    c('Health & protection','Pag-IBIG'), c('Health & protection','HMO / life insurance premiums'),
    c('Health & protection','Medicines & vitamins'),
    c('Giving','Church offerings', false), c('Giving','Support for parents / relatives', false),
    c('Wants','Eating out & food delivery', false), c('Wants','Family outings', false),
    subsLine()
  ]);
}
// Dad's and Mom's own categories. Postpartum care is on Mommy's list
// because Baby is a newborn.
var PARENT_LINES={
  Daddy:[['Personal allowance',false],['Haircut & grooming',false],['Clothes & shoes',false],['Own mobile load / data',false],['Health check-ups & medicines',true],['Hobbies / sports',false]],
  Mommy:[['Personal allowance',false],['Salon & self-care',false],['Clothes & shoes',false],['Own mobile load / data',false],['Postpartum check-ups & vitamins',true]]
};
function parentLines(g){ return PARENT_LINES[g].map(function(x){ return {id:uid(),group:g,name:x[0],amount:0,essential:x[1]}; }); }

// Big-ticket dreams, saved for in cash once the foundation is built. Targets
// start empty — the family prices their own.
function defaultDreams(){
  return [
    {id:uid(),kind:'house',emoji:'🏠',name:'House',target:0,saved:0,date:'',source:'family',status:'saving',price:0,dpPct:20},
    {id:uid(),kind:'solar',emoji:'☀️',name:'Solar power system',target:0,saved:0,date:'',source:'family',status:'saving',billSave:0},
    {id:uid(),kind:'ai',emoji:'🖥️',name:'Full AI workstation',target:0,saved:0,date:'',source:'business',status:'saving'}
  ];
}

function subsLine(){
  return {id:uid(),group:'Wants',name:'Subscriptions',amount:0,essential:false,
    subs:['Netflix','Spotify','YouTube Premium','iCloud / Google One'].map(function(n){return {id:uid(),name:n,amount:0};})};
}

function freshState(){
  return {
    v:1,
    currency:'₱',
    family:[
      {id:uid(),name:'Dad',age:'32'},{id:uid(),name:'Mom',age:'31'},
      {id:uid(),name:'Kuya',age:'4'},{id:uid(),name:'Baby',age:'2 mos'}
    ],
    businesses:[newBiz('Business 1'),newBiz('Business 2')],
    bizExp:[],                         // business expenses actually paid {id,date,bizId,itemId,amount,note}
    split:{tax:8, biz:15},             // tax % of sales, reinvest % of profit
    tithe:{pct:10, base:'profit'},     // tithe % of the chosen base, given before the salary
    salary:{method:'lowest', lookback:6, manual:0},
    efMonths:6,                        // full emergency fund target (irregular income: 6–12)
    starterMonths:1,                   // starter emergency fund, in months of essentials
    holdingStart:0,
    walletStart:0,                     // business account balance when the app was started
    saveStart:null,                    // first day of daily debt saving (defaults to the 1st of the month)
    incomes:[],                        // {id,date,source,amount,note}
    moves:[],                          // {id,date,kind:'draw'|'sweep'|'debtpay'|'fund',to,amount,note}
    budget:defaultBudget(),
    spend:[],                          // {id,date,catId,amount,note}
    debts:[],                          // {id,name,balance,rate,min,start}
    strategy:'snowball',
    extraOverride:null,                // manual extra-to-debt per month, null = auto
    funds:{emergency:0, education:0, retirement:0},
    goals:{education:500000, retirement:0},
    protect:{},                        // checklist ticks
    dreams:defaultDreams(),            // {id,kind,emoji,name,target,saved,date:'YYYY-MM',source,status,...}
    started:todayISO()
  };
}

var S;
function load(){
  try{ var raw=localStorage.getItem(KEY); if(raw){ S=Object.assign(freshState(), JSON.parse(raw)); migrate(); save(); return; } }catch(e){}
  S=freshState();
}
// Bring older saves up to date: business names become business records;
// an unused "Church / tithes" line becomes offerings (the tithe is now a %).
function migrate(){
  S.businesses=(S.businesses||[]).map(function(b){ return typeof b==='string'?newBiz(b):b; });
  S.bizExp=S.bizExp||[];
  if(!S.saveStart) S.saveStart=thisMonth()+'-01';
  S.wallets=S.wallets||{};
  if(!S.accounts){
    var byBank={}; S.accounts=[]; S.assign={};
    Object.keys(S.wallets).forEach(function(k){ var w=S.wallets[k], n=(w.bank||'').trim(); if(!n) return;
      if(!byBank[n]){ byBank[n]={id:uid(),name:n,logo:w.logo||''}; S.accounts.push(byBank[n]); }
      S.assign[k]=byBank[n].id; });
  }
  S.moves.forEach(function(m){
    if(m.kind!=='xfer') return;
    var to=String(m.to), from=String(m.from);
    if(to.indexOf('debt:')===0){ S.moves.push({id:uid(),date:m.date,kind:'debtsave',to:to.slice(5),amount:num(m.amount),note:'Saved (from transfer)'}); m.to='debt'; }
    if(from.indexOf('debt:')===0){ S.moves.push({id:uid(),date:m.date,kind:'debtrelease',to:from.slice(5),amount:num(m.amount),note:'Returned (from transfer)'}); m.from='debt'; }
  });
  var ids={}; S.debts.forEach(function(d){ ids[d.id]=1; });
  S.moves=S.moves.filter(function(m){ return !((m.kind==='debtpay'||m.kind==='debtsave'||m.kind==='debtrelease')&&!ids[m.to])&&!(m.kind==='sweep'&&String(m.to).indexOf('debt:')===0&&!ids[String(m.to).slice(5)]); });
  S.businesses.forEach(function(b){
    var opw=openDaysOf(b).length, first=S.incomes.filter(function(i){return i.source===b.name;}).map(function(i){return i.date;})
      .concat(S.bizExp.filter(function(e){return e.bizId===b.id;}).map(function(e){return e.date;})).sort()[0]||todayISO();
    b.opex.forEach(function(o){
      if(o.freq==='day'&&o.pay&&o.pay!=='same'){
        var a=num(o.amount);
        if(o.pay==='week'){ o.freq='week'; o.wd=o.payWd==null?6:+o.payWd; o.amount=Math.round(a*opw); }
        else if(o.pay==='semi'){ o.freq='semi'; o.amount=Math.round(a*opw*52/24); }

      }

      if(!o.freq) o.freq='month';
      if(!o.from) o.from=first;
    });
  });
  S.tithe=S.tithe||{pct:10,base:'profit'};
  S.budget.forEach(function(b){ if(/^church \/ tithes$/i.test(b.name)&&!num(b.amount)) b.name='Church offerings'; });
  // Daddy and Mommy categories, placed after the kids (before Transport);
  // the old "Dad/Mom personal allowance" lines move in with their amounts and history.
  [['Daddy',/^dad personal allowance$/i],['Mommy',/^mom personal allowance$/i]].forEach(function(pg){
    if(S.budget.some(function(b){return b.group===pg[0];})) return;

    if(oldIdx>=0){ var old=S.budget.splice(oldIdx,1)[0]; old.group=pg[0]; old.name='Personal allowance'; lines[0]=old; }
    var at=S.budget.findIndex(function(b){return b.group==='Transport';});

  S.budget.forEach(function(b,i){ if(/^subscriptions \(netflix/i.test(b.name)&&!num(b.amount)&&!hasSubs(b)){ var n=subsLine(); n.id=b.id; n.group=b.group; S.budget[i]=n; } });
}

/* ------------------------------------------------------------ the maths */

/* The family business, month by month:
     sales − opex = profit
     profit − tax − tithe − reinvest = family share (→ holding tank)
   Tax is a % of sales (BIR 8% style); reinvest is a % of profit; the tithe
   is a % of whichever base the family chose, so it rises and falls with
   income and is given BEFORE the family pays itself a salary. Opex for a
   month is the business expenses actually logged, or — if none were logged
   but the business made sales — its planned monthly opex (marked estimate). */
var OPEX_DEFAULTS=['Rent / space','Staff wages & SSS','Supplies / inventory','Utilities (power, water, internet)','Transport & delivery','Permits, fees & platform charges'];
function newBiz(name){ return {id:uid(), name:name, desc:'', opex:OPEX_DEFAULTS.map(function(n){return {id:uid(),name:n,amount:0,freq:'month',day:30,from:todayISO()};})}; }
function bizNames(){
  var n=S.businesses.map(function(b){return b.name;});
  S.incomes.forEach(function(i){ if(n.indexOf(i.source)<0) n.push(i.source); });
  return n;
}
function bizByName(n){ return S.businesses.find(function(b){return b.name===n;}); }
// Opex lines: an amount per period, paid on the period's due date, which
// repeats on its schedule. The money is SET ASIDE a little every open day

// the full amount has built up out of daily sales.
var OPEN_DAYS={all:[0,1,2,3,4,5,6], monsat:[1,2,3,4,5,6], monfri:[1,2,3,4,5]};
var OPEN_LABEL={all:'Every day', monsat:'Mon–Sat', monfri:'Mon–Fri'};
var FREQ_LABEL={day:'daily', week:'weekly', '2week':'every 2 weeks', semi:'15th & end of month', month:'monthly', quarter:'quarterly', year:'yearly', once:'once'};
var PER_LABEL={day:'/day', week:'/week', '2week':'/2 wks', semi:'/half-month', month:'/month', quarter:'/quarter', year:'/year', once:' once'};

function isoOf(y,m,d){ return y+'-'+pad(m)+'-'+pad(d); }

function dow(iso){ return new Date(iso+'T00:00:00').getDay(); }

function openDaysOf(b){ return OPEN_DAYS[(b&&b.open)||'all']; }
function isOpen(b,iso){ return openDaysOf(b).indexOf(dow(iso))>=0; }

// First due date on or after `from`.
function nextDue2(o, b, from){
  var f=o.freq||'month', mk=from.slice(0,7), k, a, x;
  if(f==='day'){ x=from; for(k=0;k<14;k++){ if(isOpen(b,x)) return x; x=addDays(x,1); } return from; }
  if(f==='week'){ var wd=o.wd==null?6:+o.wd; x=from; for(k=0;k<7;k++){ if(dow(x)===wd) return x; x=addDays(x,1); } }
  if(f==='2week'){ a=o.date||o.from||from; if(a>=from) return a;
    var days=Math.round((new Date(from+'T00:00:00')-new Date(a+'T00:00:00'))/864e5); return addDays(a,Math.ceil(days/14)*14); }
  if(f==='semi'){ if(from<=mk+'-15') return mk+'-15'; return lastOfMonth(mk); }

  if(f==='quarter'||f==='year'){ a=o.date||o.from||from; var step=f==='quarter'?3:12, am=a.slice(0,7), ad=+a.slice(8,10);
    if(a>=from) return a;
    var n=Math.ceil(monthsBetween(am,mk)/step)*step; x=monthDay(addMonths(am,n),ad);

// The due date before `due` (start of its cycle, exclusive).
function prevDue2(o, b, due){
  var f=o.freq||'month', mk=due.slice(0,7), x, k;
  if(f==='day'){ x=addDays(due,-1); for(k=0;k<14;k++){ if(isOpen(b,x)) return x; x=addDays(x,-1); } return addDays(due,-1); }
  if(f==='week') return addDays(due,-7);
  if(f==='2week') return addDays(due,-14);
  if(f==='semi') return +due.slice(8,10)===15?lastOfMonth(addMonths(mk,-1)):mk+'-15';
  if(f==='month') return monthDay(addMonths(mk,-1),+o.day||1);
  if(f==='quarter'||f==='year'){ var a=o.date||due; return monthDay(addMonths(mk,f==='quarter'?-3:-12),+a.slice(8,10)); }
  return addDays(o.from||due,-1);   // once: set aside from when the line was added
}
// Set aside for one line over (fromExcl, toIncl]: each cycle's amount spread
// evenly over the open days in that cycle. Nothing before the line started.
function accrued(o, b, fromExcl, toIncl){
  var ma=metaFor(o); if(ma) return metaAccrued(ma, fromExcl, toIncl);
  var amt=num(o.amount); if(!(amt>0)) return 0;
  if(o.from&&fromExcl<addDays(o.from,-1)) fromExcl=addDays(o.from,-1);
  if((o.freq||'month')==='day') return toIncl>fromExcl?openCount(b,fromExcl,toIncl)*amt:0;
  var total=0, d=fromExcl, guard=0;
  while(d<toIncl&&guard++<400){
    var due=nextDue2(o,b,addDays(d,1)); if(!due) break;
    var start=prevDue2(o,b,due), segEnd=due<toIncl?due:toIncl;
    var days=openCount(b,start,due), rate=days?amt/days:amt/Math.max(1,Math.round((new Date(due+'T00:00:00')-new Date(start+'T00:00:00'))/864e5));
    total+=rate*(days?openCount(b,d,segEnd):Math.round((new Date(segEnd+'T00:00:00')-new Date(d+'T00:00:00'))/864e5));
    d=segEnd;
  }
  return total;
}
// Typical daily value of a line (per open day), for the report.
function dailyValue(o, b){
  var t=todayISO();
  if((o.freq||'month')==='day') return num(o.amount);
  var due=nextDue2(o,b,t); if(!due) return 0;
  var start=prevDue2(o,b,due), n=openCount(b,start,due);
  return n?num(o.amount)/n:0;
}
// Set aside in month mk (through today for the current month).
function opexDue(o, b, mk){
  var cm=thisMonth(); if(mk>cm) return 0;
  var to=mk===cm?todayISO():lastOfMonth(mk);
  return accrued(o,b,addDays(mk+'-01',-1),to);
}
// One line right now: next due date and amount, how much of this cycle is
// set aside, what has been paid, and what is held for it overall.
function opexLineStatus(o, b){
  var ma=metaFor(o);
  if(ma){ var paid=sum(S.bizExp.filter(function(e){return e.itemId===o.id;}),function(e){return num(e.amount);});
    return {next:null, due:metaOwed(ma), cycleAside:0, cyclePaid:0, reserve:accrued(o,b,'2000-01-01',todayISO())-paid, daily:metaProjection(ma).pace*metaTax(ma), meta:true}; }
  var t=todayISO(), paidAll=sum(S.bizExp.filter(function(e){return e.itemId===o.id;}),function(e){return num(e.amount);});
  var next=nextDue2(o,b,t), lastPaid=S.bizExp.filter(function(e){return e.itemId===o.id;}).map(function(e){return e.date;}).sort().pop()||null;
  // Paid already for today's due date → look at the following one.
  if(next&&next===t&&lastPaid&&lastPaid>prevDue2(o,b,next)) next=nextDue2(o,b,addDays(t,1));
  var start=next?prevDue2(o,b,next):t;
  var cycleAside=next?accrued(o,b,start,t<next?t:next):0;
  var cyclePaid=next?sum(S.bizExp.filter(function(e){return e.itemId===o.id&&e.date>start&&e.date<=next;}),function(e){return num(e.amount);}):0;
  var asideAll=accrued(o,b,'2000-01-01',t);
  return {next:next, due:num(o.amount), cycleAside:cycleAside, cyclePaid:cyclePaid, reserve:asideAll-paidAll, daily:dailyValue(o,b)};
}
// Opex savings, same idea as the debts: business money set aside by hand
// for each line, used first when the line is paid.
function opexJar(o){
  var inn=sum(S.moves.filter(function(m){return m.kind==='opexsave'&&m.to===o.id;}),function(m){return num(m.amount);});
  var out=sum(S.bizExp.filter(function(e){return e.itemId===o.id;}),function(e){return num(e.fromJar);});
  var back=sum(S.moves.filter(function(m){return m.kind==='opexrelease'&&m.to===o.id;}),function(m){return num(m.amount);});
  return Math.max(0,inn-out-back);
}
// One line's daily saving toward its next due date: what should be saved by
// today (its daily slices so far this cycle), what's saved, what to allot now.
function opexSaving(o, b){
  var ma=metaFor(o);
  if(ma){
    // Meta bills when it decides to: set aside what's been spent (with VAT)
    // and not yet charged, so the money is there when the charge comes.
    var owed=metaOwed(ma), jar0=opexJar(o), pace=metaProjection(ma).pace*metaTax(ma);
    return {o:o, b:b, meta:ma, next:'9999-12-31', due:owed, expected:owed, jar:jar0, daily:pace,
      today:Math.max(0,owed-jar0), needPerDay:Math.max(0,owed-jar0), ready:jar0>=owed-0.5, daysLeft:0};
  }
  if(!(num(o.amount)>0)) return null;
  var st=opexLineStatus(o,b); if(!st.next) return null;
  var t=todayISO(), next=st.next, start=prevDue2(o,b,next);
  var expected=Math.min(st.due, accrued(o,b,start,t<next?t:next)), jar=opexJar(o);
  var openLeft=Math.max(1,openCount(b,addDays(t,-1),next));
  var jarToday=sum(S.moves.filter(function(m){return m.kind==='opexsave'&&m.to===o.id&&m.date===t;}),function(m){return num(m.amount);});
  // Even share of what's left over the open days left (today included).
  var share=isOpen(b,t)||t===next?Math.max(0,Math.min(st.due-jar,(st.due-jar+jarToday)/openLeft-jarToday)):0;
  return {o:o, b:b, next:next, due:st.due, expected:expected, jar:jar, daily:dailyValue(o,b),
    today:share, needPerDay:Math.max(0,st.due-jar)/openLeft,
    ready:jar>=st.due-0.5, daysLeft:Math.max(0,daysBetween(t,next))};
}
function opexSavings(bizId){
  var out=[];
  S.businesses.forEach(function(b){ if(bizId&&b.id!==bizId) return; b.opex.forEach(function(o){ var x=opexSaving(o,b); if(x) out.push(x); }); });
  return out.sort(function(a,b){ return a.next.localeCompare(b.next)||b.due-a.due; });
}
// Opex report for a month: daily budget building up vs sales, per business.
function opexReport(mk, onlyBizId){
  var cm=thisMonth(), last=mk===cm?+todayISO().slice(8,10):mk<cm?daysIn(mk):0, days=[], cumB=0, cumS=0;
  var bizs=S.businesses.filter(function(b){return !onlyBizId||b.id===onlyBizId;});
  for(var d=1; d<=last; d++){
    var iso=mk+'-'+pad(d), prev=addDays(iso,-1), bud=0, sales=0;
    bizs.forEach(function(b){
      b.opex.forEach(function(o){ bud+=accrued(o,b,prev,iso); });
      sales+=sum(S.incomes.filter(function(i){return i.source===b.name&&i.date===iso;}),function(i){return num(i.amount);});
    });
    cumB+=bud; cumS+=sales; days.push({d:d, iso:iso, bud:bud, sales:sales, cumB:cumB, cumS:cumS});
  }
  return {days:days, budget:cumB, sales:cumS, deficit:Math.max(0,cumB-cumS), surplus:Math.max(0,cumS-cumB)};
}
// The business wallet: everything the businesses took in, minus what really
// left it (expenses paid, tax paid, tithe given, family share moved to the
// tank). What it should hold is split into what is already spoken for.
function bizWallet(){
  var w={sales:0, opex:0, tax:0, tithe:0, reinvest:0, family:0};
  flowMonths().forEach(function(mk){ var f=monthFlow(mk); w.sales+=f.revenue; w.opex+=f.opex; w.tax+=f.tax; w.tithe+=f.tithe; w.reinvest+=f.reinvest; w.family+=f.family; });
  w.paidOpex=sum(S.bizExp.filter(function(e){return e.kind!=='tax';}),function(e){return num(e.amount);});
  w.paidTax=sum(S.bizExp.filter(function(e){return e.kind==='tax';}),function(e){return num(e.amount);});
  w.given=titheGiven();
  w.balance=num(S.walletStart)+w.sales-w.paidOpex-w.paidTax-w.given-w.family+xferNetPrefix('biz:')-acctFees('biz:');
  w.taxRes=w.tax-w.paidTax; w.titheRes=w.tithe-w.given;
  w.jars=0; S.businesses.forEach(function(b){ b.opex.forEach(function(o){ w.jars+=opexJar(o); }); });
  w.opexRes=w.jars;
  w.free=w.balance-w.jars-Math.max(0,w.taxRes)-Math.max(0,w.titheRes);
  return w;
}
// A typical full month of a line (for the Profile summary).
function opexMonthly(o, b){
  var ma=metaFor(o); if(ma) return metaProjection(ma).month*metaTax(ma);
  var a=num(o.amount), f=o.freq||'month', openPerMonth=openDaysOf(b).length*52/12;
  return {day:a*openPerMonth, week:a*52/12, '2week':a*26/12, semi:a*2, month:a, quarter:a/3, year:a/12, once:0}[f]||0;
}
function plannedOpex(b){ return b?sum(b.opex,function(o){return opexMonthly(o,b);}):0; }
function flowMonths(){
  var m={}; S.incomes.forEach(function(i){m[monthKey(i.date)]=1;}); S.bizExp.forEach(function(e){m[monthKey(e.date)]=1;});
  // Months where planned opex was being set aside count too (a month with costs but no sales is a deficit).
  var cm=thisMonth();
  S.businesses.forEach(function(b){ b.opex.forEach(function(o){
    if(num(o.amount)>0&&o.from){ for(var mk=monthKey(o.from), g=0; mk<=cm&&g<120; mk=addMonths(mk,1), g++) m[mk]=1; }
  }); });
  return Object.keys(m).sort();
}
var TITHE_BASES={gross:'total sales',profit:'business profit (after opex)',family:'family share'};
function monthFlow(mk, onlyBiz){
  var r={revenue:0, opex:0, opexEst:false, byBiz:[]};
  (onlyBiz?[onlyBiz]:bizNames()).forEach(function(name){
    var b=bizByName(name);
    var rev=sum(S.incomes.filter(function(i){return i.source===name&&monthKey(i.date)===mk;}),function(i){return num(i.amount);});
    var acts=b?S.bizExp.filter(function(e){return e.bizId===b.id&&e.kind!=='tax'&&monthKey(e.date)===mk;}):[];
    var planned=0;
    // Planned lines cost what is set aside for them as days pass (only in months
    // the business ran); paying them later on the due date draws on that set-aside.
    if(b) b.opex.forEach(function(o){ if(num(o.amount)>0) planned+=opexDue(o,b,mk); });
    // Lines with no plan (or since deleted) count when they're paid.
    var actual=sum(acts.filter(function(e){ var o=b&&b.opex.find(function(x){return x.id===e.itemId;}); return !o||!(num(o.amount)>0); }),function(e){return num(e.amount);});
    r.revenue+=rev; r.actual=(r.actual||0)+actual; r.planned=(r.planned||0)+planned;
    r.byBiz.push({name:name, biz:b, revenue:rev, opex:actual+planned, actual:actual, planned:planned, est:planned>0, profit:rev-actual-planned});
  });
  var calc=function(planned){
    var x={}; x.opex=(r.actual||0)+planned; x.profit=r.revenue-x.opex;
    x.tax=r.revenue*num(S.split.tax)/100;
    x.reinvest=Math.max(0,x.profit)*num(S.split.biz)/100;
    var base=S.tithe.base;
    x.titheBase=base==='gross'?r.revenue:base==='family'?Math.max(0,x.profit-x.tax-x.reinvest):Math.max(0,x.profit);
    x.tithe=x.titheBase*num(S.tithe.pct)/100;

  // the shortfall shows in the business wallet instead.

function titheGiven(mk){ return sum(S.spend.filter(function(x){return x.catId==='tithe'&&(!mk||monthKey(x.date)===mk);}),function(x){return num(x.amount);}); }
// Tithe set aside but not yet given, across all months.
function titheOwed(){ return sum(flowMonths(),function(mk){return monthFlow(mk).tithe;}) - titheGiven(); }
// Family share per month over the look-back window (complete months before
// this one). Months with no income inside the window count as zero — that is
// exactly the lean month the salary has to survive.
function salaryWindow(){

function acctHas(){

  S.bizExp.forEach(function(e){

// What the paid-out salary has already been used for this month: budget
// spending (the tithe comes from income, not here) plus debt payments.
function salarySpent(mk){

    function(m){ return m.kind==='debtsave'?num(m.amount):m.kind==='debtrelease'?-num(m.amount):num(m.amount)-num(m.fromJar); });
  // Money moved out of the family wallet (net of money moved in).

// Month-by-month payoff simulation. Interest accrues on each balance, every
// debt gets its minimum, then the rest of the money (extra + minimums freed by
// debts already killed) goes to the target debt: smallest balance first
// (snowball) or highest rate first (avalanche).
//
// The monthly debt budget stays FIXED at next month's minimums + extra: when a
// debt dies (or a PayLater bill shrinks) its money rolls onto the next target.
// Month m of the simulation is calendar month thisMonth()+m.
function simulate(strategy, extra){
  var cm=thisMonth();
  var ds=activeDebts().map(function(d){return {id:d.id,name:d.name,src:d,bal:num(d.balance),rate:num(d.rate),paidOff:null,interest:0};});
  if(!ds.length) return {months:0, interest:0, debts:[], ok:true, timeline:[]};
  var budget=sum(ds,function(d){return minFor(d.src,addMonths(cm,1));})+extra, month=0, interest=0, timeline=[];
  while(ds.some(function(d){return d.bal>0.5;}) && month<600){
    month++;
    var mk=addMonths(cm,month), paid=0;
    var mins=sum(ds,function(d){return d.bal>0.5&&!paidFor(d.src,mk)?Math.min(minFor(d.src,mk),d.bal):0;});
    var avail=Math.max(budget,mins);
    ds.forEach(function(d){ if(d.bal>0.5){ var i=d.bal*d.rate/1200; d.bal+=i; d.interest+=i; interest+=i; } });
    var minList=[], extraList=[];
    ds.forEach(function(d){
      if(d.bal<=0.5) return;
      // Paid ahead for this month: nothing due, so its share rolls onto the focus debt.
      if(paidFor(d.src,mk)){ if(minFor(d.src,mk)>0) minList.push({name:d.name,amt:0,due:+d.src.due||0,prepaid:true}); return; }
      var p=Math.min(minFor(d.src,mk),d.bal,avail); if(p>0.005){ d.bal-=p; avail-=p; paid+=p; minList.push({name:d.name,amt:p,due:+d.src.due||0}); }
    });
    var minTotal=paid;
    var order=ds.filter(function(d){return d.bal>0.5;}).sort(strategy==='avalanche'
      ? function(a,b){return b.rate-a.rate||a.bal-b.bal;}
      : function(a,b){return a.bal-b.bal||b.rate-a.rate;});
    var focus=order[0]?order[0].name:'';
    for(var k=0;k<order.length&&avail>0.005;k++){ var p2=Math.min(order[k].bal,avail); order[k].bal-=p2; avail-=p2; paid+=p2; extraList.push({name:order[k].name,amt:p2}); }
    var freed=[];
    ds.forEach(function(d){ if(d.bal<=0.5&&d.paidOff==null){ d.bal=0; d.paidOff=month; freed.push(d.name); } });
    minList.sort(function(a,b){return a.due-b.due;});
    timeline.push({mk:mk, paid:paid, minTotal:minTotal, mins:minList, extra:paid-minTotal, extras:extraList, bal:sum(ds,function(d){return d.bal;}), focus:focus, freed:freed});
  }
  var ok=!ds.some(function(d){return d.bal>0.5;});
  return {months:ok?month:Infinity, interest:interest, debts:ds, ok:ok, timeline:timeline};
}
// The payments one debt will ask for, month by month, from its next due
// month until the balance runs out (contract only, no snowball extra).
function projectDebt(d, limit){
  var out={}, bal=num(d.balance), mk=nextDue(d).mk, n=0;
  while(bal>0.5 && n<(limit||120)){
    if(paidFor(d,mk)){ mk=addMonths(mk,1); n++; continue; }   // paid ahead; balance already reflects it
    bal+=bal*num(d.rate)/1200;
    var a=Math.min(minFor(d,mk),bal);
    if(a>0.005){ out[mk]=a; bal-=a; }
    else if(!d.schedule) break;                       // no fixed payment: nothing to project
    else if(!Object.keys(d.schedule).some(function(k){return k>mk && num(d.schedule[k])>0;})) break;
    mk=addMonths(mk,1); n++;
  }
  return out;
}
// Months of payments: how many are left, how many the debt had in total.
// Null when the debt has no monthly payment (money owed to people).
function debtMonths(d){
  if(!d.schedule && num(d.min)<=0) return null;
  var proj=num(d.balance)>0.5?projectDebt(d,600):{}, keys=Object.keys(proj).sort(), left=keys.length, total;
  if(d.schedule) total=Object.keys(d.schedule).filter(function(k){return num(d.schedule[k])>0;}).length;
  else total=Math.ceil(Math.max(num(d.start),num(d.balance))/num(d.min)-0.001);
  total=Math.max(total,left);
  return {left:left, total:total, last:keys[keys.length-1]||null};
}
// Segmented progress: one slice per monthly payment, paid ones filled.
function sliceBar(total, done, color){
  if(total>72) return barHTML(pct(done,total),'good');
  var h='<div class="slices" role="img" aria-label="'+done+' of '+total+' monthly payments made">';
  for(var i=0;i<total;i++) h+='<i'+(i<done?' class="on"':'')+(color&&i<done?' style="background:'+color+'"':'')+'></i>';
  return h+'</div>';
}

// What the contracts alone demand each month (no snowball roll-over): shows
// when the installment load drops as loans and PayLater bills finish.
function contractual(n){
  var cm=thisMonth(), ds=activeDebts().map(function(d){return {src:d,bal:num(d.balance),rate:num(d.rate)};}), out=[];
  for(var m=1;m<=n;m++){
    var mk=addMonths(cm,m), paid=0;
    ds.forEach(function(d){ if(d.bal>0.5&&!paidFor(d.src,mk)){ d.bal+=d.bal*d.rate/1200; var p=Math.min(minFor(d.src,mk),d.bal); d.bal-=p; paid+=p; } });
    out.push({mk:mk, v:paid});
  }
  return out;
}

function monthsBetween(a,b){ return (+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5,7)-+a.slice(5,7)); }

      done: S.dreams.length>0 && !openDreams().length,

function cumChart(days){
  var W=320,H=150,pt=16,pb=20,n=days.length;
  var max=Math.max.apply(null,days.map(function(d){return Math.max(d.cumB,d.cumS);}).concat([1]));
  var X=function(i){return +(i/(n-1)*W).toFixed(1);}, Y=function(v){return +(pt+(H-pt-pb)*(1-v/max)).toFixed(1);};
  var path=function(k){ return days.map(function(d,i){return (i?'L':'M')+X(i)+','+Y(d[k]);}).join(''); };
  var lastD=days[n-1];
  // the gap between the two lines, shaded where the budget is ahead of sales
  var gap=days.map(function(d,i){return (i?'L':'M')+X(i)+','+Y(d.cumB);}).join('')+days.slice().reverse().map(function(d,j){return 'L'+X(n-1-j)+','+Y(Math.min(d.cumS,d.cumB));}).join('')+'Z';
  return '<div class="lc" data-xs="'+days.map(function(d,i){return X(i);}).join(',')+'" data-ys="'+days.map(function(d){return Y(Math.max(d.cumB,d.cumS));}).join(',')+'" data-tips="'+esc(JSON.stringify(days.map(function(d){
      return monthLabel(d.iso.slice(0,7)).split(' ')[0]+' '+d.d+': budget '+money(d.cumB)+' · sales '+money(d.cumS)+(d.cumB>d.cumS?' · deficit '+money(d.cumB-d.cumS):'');
    })))+'">'+
    '<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Opex budget vs sales, cumulative this month">'+
    '<path d="'+gap+'" fill="var(--bad)" opacity=".12"/>'+
    '<path d="'+path('cumS')+'" fill="none" stroke="var(--brand)" stroke-width="2" stroke-linejoin="round"/>'+
    '<path d="'+path('cumB')+'" fill="none" stroke="var(--c1)" stroke-width="2" stroke-dasharray="5 3" stroke-linejoin="round"/>'+

  var last7=0; for(d=0; d<7; d++) last7+=salesOn(addDays(t,-d));

  body+='<div class="grid g3 dash" style="margin:8px 0">'+

    tile('This month',shortMoney(month),growth==null?'—':'<span class="'+(growth<0?'neg':'pos')+'">'+(growth>=0?'▲ ':'▼ ')+Math.abs(growth).toFixed(0)+'%</span> vs '+monthLabel(pmk).split(' ')[0])+
    tile('Avg / open day',money(avg),'<span class="'+(avg<breakEven?'neg':'pos')+'">'+(avg<breakEven?'below':'above')+' break-even</span>')+
    tile('Break-even / day',money(breakEven),below+' day'+(below===1?'':'s')+' below')+
    tile('Profit margin','<span class="'+(margin<0?'neg':'')+'">'+margin.toFixed(0)+'%</span>','opex '+opexPct.toFixed(0)+'% of sales')+
    (dashBiz==='all'?tile('Runway',runway==null?'—':Math.floor(runway)+' days','free money ÷ daily opex'):tile('Best day',best&&best.v>0?shortMoney(best.v):'—',best&&best.v>0?shortDate(best.iso):''))+
    '</div>';
  if(days.length) body+='<div class="k" style="margin-top:4px">Daily sales vs break-even</div>'+
    barChart(days.map(function(x){ return {label:(x.d===1||x.d%5===0)?String(x.d):'', v:x.v, color:x.v<breakEven-0.5?'var(--warn)':'var(--brand)',
      tip:shortDate(x.iso)+': '+money(x.v)+(x.open?'':' (closed)')+(x.v<breakEven-0.5?' · below break-even':'')}; }),

    '<div class="row" style="gap:14px;font-size:12px"><span><span class="sw" style="background:var(--brand)"></span> at/above break-even</span><span><span class="sw" style="background:var(--warn)"></span> below</span></div>';

    var rows=S.businesses.map(function(b){ var ff=monthFlow(mk,b.name); return {b:b,f:ff}; }), mx=Math.max.apply(null,rows.map(function(r){return r.f.revenue;}).concat([1]));
    body+='<div class="k" style="margin-top:10px">Side by side · '+monthLabel(mk)+'</div>'+rows.map(function(r){

  }

    '<li><b>Break-even / day:</b> sales needed each open day to cover the daily opex and the tax on those sales. Below it, the business is eating into money set aside.</li>'+
    '<li><b>Profit margin:</b> profit ÷ sales. <b>Opex %</b> is how much of each peso of sales goes to running costs.</li>'+

function upcomingDues(n){

    .filter(function(x){ var dt=new Date(x.date+'T00:00:00'); return x.amount>0.5 && dt>=t && dt<=lim; })
    .sort(function(a,b){return a.date.localeCompare(b.date)||b.amount-a.amount;});
}

// Calendar of required payments. Past days show what was recorded as paid;

var cal={view:'month', mk:null, day:null};
function duesInMonth(mk){
  var out=[], dim=daysIn(mk);
  liveDebts().forEach(function(d){
    S.moves.forEach(function(m){ if(m.kind==='debtpay'&&m.to===d.id&&payMonth(m)===mk) out.push({d:d,date:m.forMonth&&d.due?mk+'-'+pad(Math.min(+d.due,dim)):m.date,amount:num(m.amount),paid:true}); });
    if(num(d.balance)<=0.5||!d.due) return;
    var a=projectDebt(d,120)[mk];
    if(a) out.push({d:d,date:mk+'-'+pad(Math.min(+d.due,dim)),amount:a,paid:false});
  });
  return out.sort(function(x,y){return x.date.localeCompare(y.date)||y.amount-x.amount;});
}

function reverseMove(m, factor){
  var a=num(m.amount)*(factor==null?1:factor);
  if(m.kind==='debtpay'||(m.kind==='sweep'&&String(m.to).indexOf('debt:')===0)){
    var id=m.kind==='debtpay'?m.to:String(m.to).slice(5), d=S.debts.find(function(x){return x.id===id;}); if(d) d.balance=Math.max(0,num(d.balance)+a);
  } else if(m.kind==='dreamadd'||(m.kind==='sweep'&&String(m.to).indexOf('dream:')===0)){
    var g=S.dreams.find(function(x){return x.id===String(m.to).slice(6);}); if(g) g.saved=Math.max(0,num(g.saved)-a);
  } else if(m.kind==='sweep'){ S.funds[m.to]=Math.max(0,num(S.funds[m.to])-a); }
  else if(m.kind==='xfer'){ var full=factor==null||factor===1; adjustHeld(m.to,-a); adjustHeld(m.from,a+(full?num(m.fee):0)); }
}

  if(coll==='moves') reverseMove(x);

ACT.edittx=function(el){
  var coll=el.dataset.coll, x=(S[coll]||[]).find(function(y){return y.id===el.dataset.id;}); if(!x) return;
  var l=txLabelOf(coll,x), f='';
  f+='<input class="bigamt num" name="amount" inputmode="decimal" required aria-label="Amount" value="'+num(x.amount)+'">';
  if(coll==='incomes'){ var src=bizNames(); if(src.indexOf(x.source)<0) src.push(x.source); f+=selectField('source','Business',src,x.source); }
  if(coll==='spend'){ var cur=x.catId==='tithe'?'tithe':(x.subId?x.catId+'|'+x.subId:x.catId);
    f+='<div class="picked">'+esc(pickedLabel(cur))+'</div>'+catPicker(cur,{tithe:true,noRecent:true}); }
  f+=field('date','Date','type="date" required',x.date);
  if(coll!=='moves') f+=field('note','Note','',x.note||'');
  f+='<button type="button" class="danger" data-act="deltx" data-coll="'+coll+'" data-id="'+x.id+'">Delete</button>';
  openDialog('Edit · '+l.icon+' '+l.label, f, function(v){
    var a=num(v.amount); if(a<=0){ toast('Enter an amount'); return false; }
    if(coll==='moves'){
      // amount change on a transfer: apply only the difference to what it moved
      // reverseMove(x, f) undoes f × the amount; −diff/amount applies the extra (or returns the surplus)
      var diff=a-num(x.amount); if(Math.abs(diff)>0.004&&num(x.amount)>0) reverseMove(x,-diff/num(x.amount));
      x.amount=a; if(x.fromJar!=null) x.fromJar=Math.min(num(x.fromJar),a);
    } else { x.amount=a; if(x.fromJar!=null) x.fromJar=Math.min(num(x.fromJar),a); }
    x.date=v.date||x.date;
    if(coll!=='moves') x.note=v.note||'';
    if(coll==='incomes') x.source=v.source;
    if(coll==='spend'&&v.catId){ var k=String(v.catId).split('|'); x.catId=k[0]; x.subId=k[1]||null; }
    toast('Updated');
  }, 'Save');
};

// Fill every line up to its plan, in budget order, with what is available.
ACT.fillplan=function(){
  var cm=thisMonth(), left=Math.max(0,availableMoney(cm)), n=0;
  if(left>0.5) checkpoint('fund per plan');
  if(left<=0.5){ toast('Nothing left to allocate'); return; }
  S.budget.forEach(function(b){
    if(left<=0.5) return;
    if(hasSubs(b)) b.subs.forEach(function(x){ var need=num(x.amount)-fundedSub(b,x,cm); if(need>0&&left>0.5){ var g=Math.min(need,left); setAlloc(b.id+'|'+x.id,fundedSub(b,x,cm)+g,cm); left-=g; n++; } });
    else { var need=num(b.amount)-num(allocMap(cm)[b.id]); if(need>0){ var g=Math.min(need,left); setAlloc(b.id,num(allocMap(cm)[b.id])+g,cm); left-=g; n++; } }
  });
  if(dlg.open) dlg.close();
  save(); render(); toast(n?'Funded '+n+' lines per plan'+(left>0.5?' · '+money(left)+' still free':''):'Every line is already funded to plan');
};

ACT.pay=function(el){
  var d=S.debts.find(function(x){return x.id===el.dataset.id;}); if(!d) return;
  var nd=nextDue(d), forMk=el.dataset.mk||nd.mk, due=el.dataset.mk?(projectDebt(d,120)[forMk]||nd.amount):nd.amount;
  var months=[]; for(var i=0;i<6;i++){ var mm=addMonths(nd.mk,i); if(!paidFor(d,mm)) months.push([mm,monthLabel(mm,true)+(d.due?' · due '+ordinal(+d.due):'')]); }
  if(months.every(function(o){return o[0]!==forMk;})) months.unshift([forMk,monthLabel(forMk,true)]);
  openDialog('Pay · '+d.name,
    '<div class="bigdate" style="margin-top:0"><small>Balance</small><b class="num">'+money(d.balance)+'</b></div>'+
    field('amount','Amount paid','inputmode="decimal" required',due>0?Math.round(due*100)/100:'')+
    (d.due||d.schedule||num(d.min)>0?selectField('forMonth','For the payment due in',months,forMk):'')+
    field('date','Paid on','type="date"',todayISO())+
    (debtJar(d)>0.5?'<div class="note good">'+money(debtJar(d))+' saved for this debt is used first.</div>':''),
    function(v){ var a=num(v.amount); if(a<=0) return false;
      var jar=Math.min(a,debtJar(d));
      d.balance=Math.max(0,Math.round((num(d.balance)-a)*100)/100);
      S.moves.push({id:uid(),date:v.date||todayISO(),kind:'debtpay',to:d.id,amount:a,fromJar:jar,forMonth:v.forMonth||null,note:'Payment → '+d.name+(v.forMonth?' ('+monthLabel(v.forMonth)+')':'')});
      toast(d.balance<=0.5?'🎉 '+d.name+' is PAID OFF!':'Balance now '+money(d.balance)); }, 'Record');
};

ACT.acctpreset=function(){
  checkpoint('set up accounts');
  var get=function(n){ var a=ACC().find(function(x){return x.name.toLowerCase()===n.toLowerCase();}); if(!a){ a={id:uid(),name:n}; ACC().push(a); } return a; };
  var g=get('GCash'), m=get('Maya'), s2=get('GSave');
  // Sales come into GCash; the business keeps its money (and pays its bills and
  // subscriptions) in Maya; family money stays in GCash; debt savings in GSave.
  S.assign={family:g.id, tank:g.id, debt:s2.id, protect:g.id, dreams:g.id};
  S.businesses.forEach(function(b){ S.assign['biz:'+b.id]=m.id; S.assign['in:biz:'+b.id]=g.id; });
  S.budget.forEach(function(b){ if(/subscri/i.test(b.name+' '+b.group)) S.assign['line:'+b.id]=m.id; });
  if(dlg.open) dlg.close();
  save(); render(); toast('Accounts set: sales → GCash, business → Maya, debts → GSave');
};

ACT.allotevery=function(){

  save(); render();
  toast(d+b+o>0.5?'Allotted '+[d>0.5?'debts '+money(d):'',b>0.5?'budget '+money(b):'',o>0.5?'opex '+money(o):''].filter(Boolean).join(' · '):'Nothing to allot — up to date or no free money');

ACT.budallot=function(el){
  var x=budgetDaily().find(function(y){return y.key===el.dataset.key;}); if(!x) return;
  var a=Math.min(x.today,Math.max(0,availableMoney()));
  if(!(a>0.5)){ toast('No money free — pay out salary first'); return; }
  checkpoint('allot '+x.name); addAlloc(x,Math.round(a*100)/100);
  save(); render(); toast(money(a)+' → '+x.name);
};
// Needs first, then the rest, each line's share for today, until the free money runs out.
ACT.budallotall=function(el){
  var quiet=el&&el.dataset&&el.dataset.quiet;
  var list=budgetDaily().filter(function(x){return x.today>0.5;}), free=Math.max(0,availableMoney()), total=0, n=0;
  if(!list.length){ if(quiet) return 0; toast('Budget is allotted for today ✓'); return; }
  if(free<=0.5){ if(quiet) return 0; toast('No money free — pay out salary first'); return; }
  if(!quiet) checkpoint('allot today\'s budget');
  list.forEach(function(x){ var a=Math.round(Math.min(x.today,free-total)*100)/100; if(a>0.5){ addAlloc(x,a); total+=a; n++; } });
  if(quiet) return total; save(); render(); toast(money(total)+' allotted to '+n+' line'+(n>1?'s':'')+(total<sum(list,function(x){return x.today;})-0.5?' (all the free money)':''));
};

// What a wallet (or one part of it) can send right now.
// Real money a wallet can send.
function xferAvail(key){
  if(key==='outside') return Infinity;
  var w=walletList().find(function(x){return x.key===walletOf(key);});
  var id=key.slice(key.indexOf(':')+1);
  if(key.indexOf('fund:')===0) return num(S.funds[id]);
  if(key.indexOf('dream:')===0){ var g=S.dreams.find(function(x){return x.id===id;}); return g?num(g.saved):0; }
  return w?Math.max(0,w.bal):0;
}
function xferSelect(name, label, sel, sending){
  var o=function(v,t){ var av=sending?xferAvail(v):null; return '<option value="'+v+'"'+(v===sel?' selected':'')+'>'+esc(t)+(sending&&av!==Infinity?' · '+money(av):'')+'</option>'; };
  var g=function(t,inner){ return inner?'<optgroup label="'+esc(t)+'">'+inner+'</optgroup>':''; };
  var dreams=(S.dreams||[]).filter(function(d){return d.status!=='bought'&&(!sending||num(d.saved)>0.5);});
  return '<label class="f"><span>'+label+'</span><select name="'+name+'">'+
    g('Family',o('family','👪 Family budget')+o('tank','🛢️ Holding tank'))+
    g('Business',S.businesses.map(function(b){return o('biz:'+b.id,'🏪 '+b.name);}).join(''))+
    g('Debts',o('debt','💰 Saved for debts'))+
    g('Protection',Object.keys(S.funds).map(function(k){return o('fund:'+k,'🛡️ '+(FUND_NAMES[k]||k));}).join(''))+
    g('Dreams',dreams.map(function(d){return o('dream:'+d.id,'⭐ '+dreamLabel(d));}).join(''))+
    g('Other',o('outside','💵 Outside (cash, gift, other account)'))+'</select></label>';
}

// One wallet: balance, what it holds, its bank, and its transfers.
ACT.wallet=function(el){
  var key=el.dataset.key, w=walletList().find(function(x){return x.key===key;}); if(!w) return;
  var i=W()[key]||{};
  var mine=function(k){ return walletOf(k)===key; };
  var recs=S.moves.filter(function(m){ return (m.kind==='xfer'&&(mine(m.from)||mine(m.to)))||(m.kind==='draw'&&(key==='tank'||key==='family')); })
    .map(function(m,ix){return {m:m,ix:ix};}).sort(function(a,b){return b.m.date.localeCompare(a.m.date)||b.ix-a.ix;}).slice(0,15).map(function(x){return x.m;});
  var send=key==='debt'?'debt':key==='protect'?'fund:emergency':key==='dreams'?((openDreams()[0]||{}).id?'dream:'+openDreams()[0].id:'outside'):key;
  var matchable=key==='family'||key==='tank'||key==='debt'||key.indexOf('biz:')===0;
  openDialog(w.icon+' '+w.name,
    '<div class="row" style="gap:12px;align-items:center;margin-bottom:8px">'+wlogo(key,w.icon,true)+'<div style="min-width:0"><div class="v num" style="font-size:26px">'+money(w.bal)+'</div>'+
      '<small class="muted">'+(i.bank?'🏦 '+esc(i.bank)+(i.acct?' · '+esc(i.acct):''):'No bank set yet')+'</small></div></div>'+
    (w.parts&&w.parts.length?'<div class="wparts">'+w.parts.map(function(p){return '<div class="row between"><span>'+esc(p[0])+'</span><span class="num">'+money(p[1])+'</span></div>';}).join('')+'</div>':'')+
    '<div class="row" style="gap:6px;flex-wrap:wrap;margin:10px 0">'+
      '<button type="button" class="primary sm" data-act="xfer" data-from="'+send+'">⇄ Send</button>'+
      '<button type="button" class="sm" data-act="xfer" data-to="'+send+'" data-from="'+(key==='family'?'tank':'family')+'">⇄ Receive</button>'+
      (matchable?'<button type="button" class="sm" data-act="wmatch" data-key="'+key+'">⚖️ Match bank</button>':'')+
      '<button type="button" class="sm" data-act="wbank" data-key="'+key+'">🏦 Bank &amp; logo</button>'+
      (key==='tank'?'<button type="button" class="sm" data-act="sweep">Sweep</button>':'')+'</div>'+

function readLogo(file, cb){

  r.onload=function(){ var img=new Image();
    img.onload=function(){ var n=96, c=document.createElement('canvas'); c.width=c.height=n;
      var k=Math.min(n/img.width,n/img.height), w=img.width*k, h=img.height*k, x=c.getContext('2d');
      x.fillStyle='#fff'; x.fillRect(0,0,n,n); x.drawImage(img,(n-w)/2,(n-h)/2,w,h); cb(c.toDataURL('image/png')); };
    img.onerror=function(){ cb(null); }; img.src=r.result; };

var rerenderT;
document.addEventListener('keydown',function(e){ if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('cpsearch')) e.preventDefault(); });

document.addEventListener('change',function(e){
  var el=e.target;
  if(el.dataset&&el.dataset.acctlogo&&el.files&&el.files[0]){
    readLogo(el.files[0],function(url){ var a=accById(el.dataset.acctlogo); if(!url||!a) return; a.logo=url; save(); if(dlg.open) dlg.close(); render(); toast('Logo saved'); });

  }
  if(el.name==='logofile'&&el.files&&el.files[0]){

    return;
  }
  if(el.dataset&&(el.dataset.bind||el.dataset.edit||el.dataset.sub||el.dataset.opx||el.dataset.bizf||el.dataset.protect||el.dataset.biz!=null)) checkpoint('edit',true);
  if(el.id==='importFile'&&el.files[0]){

      try{
        var d=JSON.parse(r.result);
        if(d&&d.kind==='family-budget-debts'&&Array.isArray(d.debts)){
          // A debt list only: replaces the debts, leaves income/budget/goals alone.
          if(S.debts.length&&!confirm('Replace your '+S.debts.length+' debts with the '+d.debts.length+' in this file?')) return;
          checkpoint('import debts');
          S.debts=d.debts.map(function(x){ return Object.assign({id:uid(),rate:0,min:0,due:'',schedule:null,note:'',group:''},x,{start:Math.max(num(x.start),num(x.balance))}); });
          save(); tab='debts'; render(); toast(d.debts.length+' debts imported'); return;
        }
        if(!d||!Array.isArray(d.budget)) throw 0; checkpoint('restore backup'); S=Object.assign(freshState(),d); migrate(); save(); render(); toast('Backup restored');
      }
      catch(err){ toast('That file is not a valid backup'); }
    }; r.readAsText(el.files[0]); el.value=''; return;
  }
  if(el.id==='themeSel'){ applyTheme(el.value); try{ localStorage.setItem(KEY+'.theme',el.value); }catch(err){} return; }
  if(el.dataset.bind){
    var v=el.value;
    if(el.hasAttribute('data-nullable')&&String(v).trim()==='') v=null;
    else if(el.hasAttribute('data-num')) v=num(v);
    setPath(el.dataset.bind,v); save(); render(); return;

  if(el.dataset.protect){ S.protect[el.dataset.protect]=el.checked; save(); render(); return; }
  if(el.dataset.bizf){

    if(fk==='freq'&&el.value==='week'&&o.wd==null) o.wd=6;
    if(fk==='freq'&&el.value==='month'&&!o.day) o.day=30;
    save(); render(); return;
  }
  if(el.dataset.edit){
    var item=S[el.dataset.edit].find(function(x){return x.id===el.dataset.id;}); if(!item) return;
    item[el.dataset.f]= el.type==='checkbox'?el.checked : el.hasAttribute('data-num')?num(el.value):el.value;

  }

  if(el.dataset.go){ go(el.dataset.go); return; }

  if(el.dataset.delbiz!=null){ var bb=S.businesses[+el.dataset.delbiz];

  if(el.dataset.delsub){

// Tooltips: hover on desktop, tap on phones. Line charts get a crosshair.
var tipEl=document.getElementById('tip'), tipT;
function showTip(text,x,y){
  tipEl.textContent=text; tipEl.classList.add('show');
  var w=tipEl.offsetWidth, hgt=tipEl.offsetHeight;
  tipEl.style.left=Math.max(8,Math.min(window.innerWidth-w-8,x-w/2))+'px';
  tipEl.style.top=Math.max(8,y-hgt-14)+'px';
  clearTimeout(tipT); tipT=setTimeout(hideTip,3000);
}
function hideTip(){ tipEl.classList.remove('show'); document.querySelectorAll('.lc .xh,.lc .xd').forEach(function(e){e.setAttribute('visibility','hidden');}); }
function onPoint(e){
  var lc=e.target.closest&&e.target.closest('.lc');
  if(lc){
    var svg=lc.querySelector('svg'), r=svg.getBoundingClientRect(), xs=lc.dataset.xs.split(',').map(Number), ys=lc.dataset.ys.split(',').map(Number);
    var vx=(e.clientX-r.left)/r.width*320, i=0;
    for(var k=1;k<xs.length;k++) if(Math.abs(xs[k]-vx)<Math.abs(xs[i]-vx)) i=k;
    var xh=lc.querySelector('.xh'), xd=lc.querySelector('.xd');
    xh.setAttribute('x1',xs[i]); xh.setAttribute('x2',xs[i]); xh.setAttribute('visibility','visible');
    xd.setAttribute('cx',xs[i]); xd.setAttribute('cy',ys[i]); xd.setAttribute('visibility','visible');
    showTip(JSON.parse(lc.dataset.tips)[i], r.left+xs[i]/320*r.width, r.top+ys[i]/320*r.width);
    return;
  }
  var t=e.target.closest&&e.target.closest('[data-tip]');
  if(t) showTip(t.getAttribute('data-tip'), e.clientX, e.clientY); else if(e.type==='pointerdown') hideTip();
}

document.addEventListener('pointermove',function(e){ if(e.pointerType==='mouse') onPoint(e); });
