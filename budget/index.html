<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f3d3a">
<title>Family Freedom Budget</title>
<!--
  Family Freedom Budget — a get-out-of-debt plan for a family of four living on
  irregular business income (no fixed salary).

  PRIVATE BY DESIGN. Everything the family types is kept in this browser's
  localStorage and nowhere else: no server, no analytics, no Meta pixel
  (inject_pixel.mjs skips budget/ on purpose). "Export backup" is the only way
  data leaves the device, and it goes to a file the family keeps.

  The method, in one breath:
    1. Every peso the businesses earn lands in a HOLDING TANK, never straight
       into spending. Tax and business-reinvest shares are carved off first.
    2. The family pays itself ONE steady monthly SALARY out of the tank, sized
       from the lean months (lowest recent month, or 80% of the average).
    3. The budget spends that salary to zero; whatever is left, plus any
       surplus above a one-month buffer in the tank, goes to the current step
       of the roadmap: starter emergency fund -> kill debt (snowball or
       avalanche) -> one-month buffer -> full emergency fund -> protect the
       family -> kids' education + retirement.
-->
<style>
:root{
  --bg:#f5f3ee; --card:#ffffff; --ink:#1b2422; --muted:#5f6d69; --line:#e3ded3;
  --brand:#0f6e66; --brand-ink:#ffffff; --brand-soft:#dcefeb;
  --good:#1f8a4c; --good-soft:#e1f3e8; --warn:#b26a00; --warn-soft:#fbefd9;
  --bad:#c0392b; --bad-soft:#fae3df; --gold:#c8911b;
  --bar:#e9e5dc; --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px -16px rgba(0,0,0,.25);
  --radius:14px;
  /* categorical slots (validated palette, fixed order) + neutral "other" */
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#008300; --c7:#4a3aa7; --c0:#9c988f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1514; --card:#172120; --ink:#e7efec; --muted:#9aaba6; --line:#26332f;
    --brand:#3cbfb0; --brand-ink:#06201d; --brand-soft:#16332f;
    --good:#4cc47f; --good-soft:#15301f; --warn:#f0b04a; --warn-soft:#3a2c12;
    --bad:#ff7a6b; --bad-soft:#3b1d19; --gold:#f0c35a;
    --bar:#24302d; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -16px rgba(0,0,0,.6);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c0:#6d6b66;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1514; --card:#172120; --ink:#e7efec; --muted:#9aaba6; --line:#26332f;
  --brand:#3cbfb0; --brand-ink:#06201d; --brand-soft:#16332f;
  --good:#4cc47f; --good-soft:#15301f; --warn:#f0b04a; --warn-soft:#3a2c12;
  --bad:#ff7a6b; --bad-soft:#3b1d19; --gold:#f0c35a;
  --bar:#24302d; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -16px rgba(0,0,0,.6);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500; --c5:#d55181; --c6:#008300; --c7:#9085e9; --c0:#6d6b66;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom))}
h1,h2,h3{line-height:1.2;margin:0}
h2{font-size:18px}
h3{font-size:15px}
p{margin:.4em 0}
small,.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums}
header.top{background:var(--brand);color:var(--brand-ink);padding:12px 16px calc(12px);padding-top:max(12px,env(safe-area-inset-top))}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
header.top h1{font-size:18px;white-space:nowrap}
header.top .sub{opacity:.85;font-size:13px}
.hdr-step{background:rgba(255,255,255,.18);color:inherit;border:0;border-radius:99px;padding:4px 12px;min-height:32px;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%;flex:none}
.wrap{max-width:880px;margin:0 auto}
main{padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:0 0 14px;box-shadow:var(--shadow)}
.card > h2{margin-bottom:8px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:420px){.g2.stack{grid-template-columns:1fr} .g3{gap:8px} .g3 .stat{padding:10px 8px} .g3 .stat .v,.g3 .v{font-size:17px} .g3 .stat .k{font-size:10.5px}}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat .k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat .v{font-size:20px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.stat .h{font-size:12px;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;background:var(--brand-soft);color:var(--brand)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.note{border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px;background:var(--brand-soft)}
.note.warn{background:var(--warn-soft)}
.note.bad{background:var(--bad-soft)}
.note.good{background:var(--good-soft)}
.bar{height:10px;background:var(--bar);border-radius:99px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .3s}
.bar.good > i{background:var(--good)} .bar.warn > i{background:var(--warn)} .bar.bad > i{background:var(--bad)}
button,.btn{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--card);color:var(--ink);
  padding:9px 14px;border-radius:10px;cursor:pointer;min-height:40px}
button.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
button.danger{color:var(--bad)}
button.link{border:0;background:none;padding:4px 6px;min-height:0;color:var(--brand)}
button.icon{padding:4px 9px;min-height:32px;font-size:13px}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.spacer{flex:1}
label.f{display:block;font-size:13px;color:var(--muted);margin-bottom:8px}
label.f > span{display:block;margin-bottom:3px}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;
  padding:8px 10px;width:100%;min-height:40px}
input[type=checkbox]{width:20px;height:20px;min-height:0;accent-color:var(--brand)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
td.r,th.r{text-align:right}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
tr.group td{background:var(--bg);font-weight:700;font-size:13px}
td input{min-height:34px;padding:5px 8px}
td input.amt{max-width:120px;text-align:right}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);
  display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10}
nav.tabs .in{display:flex;max-width:880px;width:100%}
nav.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;
  font-size:10.5px;font-weight:600;color:var(--muted);padding:6px 0;min-height:52px;min-width:0;border-radius:10px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-selected="true"]{color:var(--brand);background:var(--brand-soft)}
.steps{list-style:none;margin:0;padding:0}
.steps li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.steps li:last-child{border-bottom:0}
.steps .n{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:700;
  background:var(--bar);color:var(--muted)}
.steps li.done .n{background:var(--good);color:#fff}
.steps li.now .n{background:var(--brand);color:var(--brand-ink)}
.steps li.now{background:linear-gradient(90deg,var(--brand-soft),transparent);margin:0 -16px;padding:12px 16px}
.steps .body{flex:1;min-width:0}
.chart{display:flex;align-items:flex-end;gap:4px;height:130px;padding-top:6px}
.chart .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end;min-width:0}
.chart .col i{display:block;width:100%;max-width:34px;background:var(--brand);border-radius:6px 6px 2px 2px;min-height:2px}
.chart .col i.low{background:var(--warn)}
.chart .col span{font-size:10px;color:var(--muted);white-space:nowrap}
.chart-wrap{position:relative}
.chart-line{position:absolute;left:0;right:0;border-top:2px dashed var(--good);pointer-events:none}
.chart-line b{position:absolute;right:0;top:-18px;font-size:11px;color:var(--good);background:var(--card);padding:0 4px}
.hero{display:flex;gap:14px;align-items:center}
.ring{flex:none;width:72px;height:72px}
details{margin-top:6px}
summary{cursor:pointer;font-weight:600;color:var(--brand)}
.hidden{display:none!important}
dialog{border:1px solid var(--line);border-radius:16px;background:var(--card);color:var(--ink);padding:18px;
  width:min(440px,calc(100vw - 32px));box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:30;
  opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{opacity:1}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input{margin-top:2px;flex:none}
/* visual layer */
.big{font-size:22px;line-height:1}
.k{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.card.tight{padding:12px;margin:0}
.card.tight .v{margin:4px 0 8px}
button.sm{min-height:34px;padding:6px 12px;font-size:14px}
button.stat{display:block;text-align:left;width:100%;font-weight:400;cursor:pointer}
button.stat .bar{margin:6px 0 4px;height:6px}
.hero .icon{font-size:22px;padding:2px 12px}
.dots{display:flex;gap:6px;margin-top:12px}
.dots i{flex:1;height:6px;border-radius:99px;background:var(--bar)}
.dots i.done{background:var(--good)} .dots i.now{background:var(--brand)}
.flow{display:flex;align-items:center;gap:2px;margin:0 0 14px}
.flow .node{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;gap:2px;box-shadow:var(--shadow)}
.flow .node b{font-size:14px} .flow .node small{font-size:11px;color:var(--muted)}
.flow .arr{color:var(--muted);font-weight:700}
.starts button{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 6px}
details.info{margin:4px 2px 16px}
details.info summary{font-size:14px;list-style:none;padding:6px 0}
details.info summary::-webkit-details-marker{display:none}
.info-b{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:14px}
.info-b ul,.info-b ol{margin:0;padding-left:20px}
details.why summary{font-size:12px;font-weight:600;color:var(--muted)}
details.why p{font-size:14px;color:var(--muted)}
.chart-svg{width:100%;height:auto;display:block;overflow:visible}
.chart-svg .axis{stroke:var(--line);stroke-width:1}
.chart-svg .tl{font-size:10px;fill:var(--muted)}
.chart-svg .tv{font-size:10px;fill:var(--ink);font-weight:600}
.chart-svg .ref{stroke:var(--good);stroke-width:1.5;stroke-dasharray:4 3}
.chart-svg .tr{font-size:10px;fill:var(--good);font-weight:600}
.chart-svg .area{fill:var(--brand);opacity:.14}
.chart-svg .aline{fill:none;stroke:var(--brand);stroke-width:2;stroke-linejoin:round}
.chart-svg .xh{stroke:var(--muted);stroke-width:1}
.chart-svg .xd{fill:var(--brand);stroke:var(--card);stroke-width:2}
.chart-svg g[data-tip]:hover path{opacity:.8}
.stack{display:flex;gap:2px;height:22px;border-radius:6px;overflow:hidden;margin:8px 0 12px}
.stack i{min-width:4px;display:block}
.legend .lg{display:grid;grid-template-columns:14px 1fr auto 44px;gap:8px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.legend .lg:last-child{border-bottom:0}
.legend .lp{text-align:right;color:var(--muted);font-size:12px}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px}
.dues{display:flex;flex-direction:column;gap:8px}
.due{display:grid;grid-template-columns:44px 1fr auto auto;gap:10px;align-items:center}
.dd{background:var(--brand-soft);color:var(--brand);border-radius:10px;text-align:center;padding:4px 0;line-height:1.1}
.dd b{display:block;font-size:18px} .dd span{font-size:10px;text-transform:uppercase;font-weight:700}
.dd.soon{background:var(--warn-soft);color:var(--warn)}
.dn{min-width:0} .dn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap} .dn small{color:var(--muted);font-size:12px}
.da{font-weight:700}
details.dueg summary{list-style:none;cursor:pointer}
details.dueg summary::-webkit-details-marker{display:none}
.chev{color:var(--muted);font-size:20px;width:44px;text-align:center;transition:transform .2s}
details.dueg[open] .chev{transform:rotate(90deg)}
.due.sub{margin-top:6px} .due.sub .dn b{font-weight:500}
.dn small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);padding:4px;border-radius:12px}
.seg button{border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:14px;padding:8px 4px}
.seg button small{font-weight:400;font-size:11px;color:var(--muted)}
.seg button[aria-checked="true"]{background:var(--card);box-shadow:var(--shadow);color:var(--brand)}
.bigdate{text-align:center;margin:12px 0 4px} .bigdate small{display:block;color:var(--muted);font-size:12px}
.bigdate b{font-size:28px;color:var(--brand)}
details.grp{padding:12px 16px}
details.grp summary{display:flex;align-items:center;gap:10px;cursor:pointer;list-style:none;font-weight:700;color:var(--ink)}
details.grp summary::-webkit-details-marker{display:none}
details.grp summary::after{content:'›';color:var(--muted);transition:transform .2s;font-size:20px;line-height:1}
details.grp[open] summary::after{transform:rotate(90deg)}
details.grp .gn{flex:1;min-width:0} details.grp .gn small{background:var(--bar);border-radius:99px;padding:0 7px;font-size:11px;color:var(--muted)}
details.grp > .bar{margin:10px 0 4px;height:6px}
.drow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.drow:last-child{border-bottom:0}
.drow.done{opacity:.55}
.dl{min-width:0} .dl b{display:block} .dl small{display:block;color:var(--muted);font-size:12px}
.dl .dnote{font-style:italic}
.dr{font-weight:600} .da2{display:flex;gap:4px}
.brow{display:grid;grid-template-columns:1fr 96px auto auto;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.brow:last-child{border-bottom:0}
.brow .bname{border-color:transparent;background:transparent;padding:6px 4px;min-height:34px}
.brow .bname:focus{background:var(--bg);border-color:var(--line)}
.brow small{display:block;padding-left:4px;font-size:12px}
.brow .amt{text-align:right;min-height:36px;padding:6px 8px}
.need{display:flex;flex-direction:column;align-items:center;font-size:9px;color:var(--muted);text-transform:uppercase;gap:1px}
.need input{width:18px;height:18px}
details.dueg summary{color:var(--ink)}
.seg.mini{display:inline-grid;padding:3px;gap:3px} .seg.mini button{padding:4px 12px;min-height:30px;font-size:13px}
.calnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px} .calnav b{font-size:16px}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.calgrid .wd{text-align:center;font-size:11px;color:var(--muted);font-weight:700;padding:2px 0}
.cd{min-height:54px;padding:3px 1px;border-radius:8px;border:1px solid transparent;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-weight:400}
.cd .cdn{font-size:12px;color:var(--muted)}
.cd.has{background:var(--brand-soft);cursor:pointer} .cd.has .cdn{color:var(--ink);font-weight:700}
.cd .cda{font-size:10px;font-weight:700;color:var(--brand);letter-spacing:-.02em}
.cd .cdd{display:flex;gap:2px} .cd .cdd i{width:5px;height:5px;border-radius:50%}
.cd.paid{background:var(--good-soft)} .cd.paid .cda{color:var(--good)}
.cd.today{border-color:var(--ink)} .cd.sel{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.calday{background:var(--bg);border-radius:12px;padding:10px;margin-top:8px}
.calday .due{grid-template-columns:12px 1fr auto auto}
.yeargrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ym{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 10px;min-height:64px;font-weight:400;text-align:left}
.ym .heat{position:absolute;inset:0;background:var(--brand);pointer-events:none}
.ym > *:not(.heat){position:relative}
.ym .ymn{font-size:12px;font-weight:700;color:var(--muted)} .ym b{font-size:15px} .ym small{font-size:11px;color:var(--muted)}
.ym.today{border-color:var(--ink)}
.ym .ymbar{position:absolute;left:0;bottom:0;height:4px;background:var(--brand);border-radius:0 2px 0 0}
.slices{display:flex;gap:2px;height:10px;margin:10px 0 0}
.slices i{flex:1;background:var(--bar);border-radius:2px;min-width:2px}
.slices i.on{background:var(--good)}
.mini-sl{display:flex;align-items:center;gap:6px;margin-top:4px} .mini-sl .slices{flex:1;height:6px;margin:0}
.mini-sl small{flex:none;font-size:11px;color:var(--muted)}
details.mbm > summary{margin-top:6px}
.sched{margin-top:8px;font-size:13px}
.sched .sh{display:grid;grid-template-columns:52px 1fr 1.6fr 56px;gap:6px;padding:7px 2px;border-bottom:1px solid var(--line);align-items:center}
.sched > .sh{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase}
.sched .sh .r{text-align:right} .sched .sh span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.sm-row > summary{list-style:none;cursor:pointer;color:var(--ink);font-weight:400}
details.sm-row > summary::-webkit-details-marker{display:none}
details.sm-row[open] > summary{background:var(--brand-soft);border-radius:8px}
.sm-b{padding:8px 6px 10px;border-bottom:1px solid var(--line)} .sm-b .row{padding:2px 0} .sub-t{border-top:1px dashed var(--line);margin-top:4px;padding-top:4px}
.fam{display:grid;grid-template-columns:40px 1fr 84px auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}
.fam .av{font-size:26px;text-align:center}
.hb{display:grid;grid-template-columns:minmax(0,34%) 1fr 52px;gap:8px;align-items:center;margin:7px 0;font-size:13px}
.hl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ht{position:relative;height:14px;background:var(--bar);border-radius:4px}
.ht i{display:block;height:100%;border-radius:4px}
.ht em{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);border-radius:2px}
.hv{text-align:right;font-weight:600}

<script>
(function(){
'use strict';

/* ------------------------------------------------------------------ state */

var KEY = 'familyFreedomBudget.v1';
var uid = function(){ return Math.random().toString(36).slice(2,10); };

function todayISO(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function pad(n){ return (n<10?'0':'')+n; }
function monthKey(iso){ return String(iso).slice(0,7); }
function shortDate(iso){ return monthLabel(monthKey(iso)).split(' ')[0]+' '+(+String(iso).slice(8,10)); }
function thisMonth(){ return monthKey(todayISO()); }
function addMonths(mk, n){ var y=+mk.slice(0,4), m=+mk.slice(5,7)-1+n; y+=Math.floor(m/12); m=((m%12)+12)%12; return y+'-'+pad(m+1); }
function monthLabel(mk, long){
  var names=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var m=+mk.slice(5,7)-1; return names[m]+(long?' '+mk.slice(0,4):" '"+mk.slice(2,4));
}

// Budget categories tuned for a Filipino family of four with a newborn and a
// preschooler. Amounts start at zero: the family fills in their own numbers.
function defaultBudget(){
  var c=function(group,name,essential){ return {id:uid(),group:group,name:name,amount:0,essential:essential!==false}; };
  return [
    c('Home','Rent / house amortization'), c('Home','Electricity'), c('Home','Water'),
    c('Home','Internet & mobile load'), c('Home','LPG / cooking gas'), c('Home','House help / laundry', false),
    c('Food','Groceries & palengke'), c('Food','Rice'), c('Food','Drinking water'),
    c('Baby (newborn)','Formula / milk'), c('Baby (newborn)','Diapers & wipes'),
    c('Baby (newborn)','Pedia check-ups & vaccines'), c('Baby (newborn)','Baby clothes & essentials'),
    c('Kuya (4 yrs old)','Preschool tuition & supplies'), c('Kuya (4 yrs old)','Milk, snacks & baon'),
    c('Kuya (4 yrs old)','Clothes & shoes'),
    c('Transport','Fuel / fare'), c('Transport','Vehicle maintenance & registration'),
    c('Health & protection','PhilHealth (both parents)'), c('Health & protection','SSS voluntary (both parents)'),
    c('Health & protection','Pag-IBIG'), c('Health & protection','HMO / life insurance premiums'),
    c('Health & protection','Medicines & vitamins'),
    c('Giving','Church / tithes', false), c('Giving','Support for parents / relatives', false),
    c('Wants','Eating out & food delivery', false), c('Wants','Family outings', false),
    c('Wants','Dad personal allowance', false), c('Wants','Mom personal allowance', false),
    c('Wants','Subscriptions (Netflix, Spotify, etc.)', false)
  ];
}

// Big-ticket dreams, saved for in cash once the foundation is built. Targets
// start empty — the family prices their own.
function defaultDreams(){
  return [
    {id:uid(),kind:'house',emoji:'🏠',name:'House',target:0,saved:0,date:'',source:'family',status:'saving',price:0,dpPct:20},
    {id:uid(),kind:'solar',emoji:'☀️',name:'Solar power system',target:0,saved:0,date:'',source:'family',status:'saving',billSave:0},
    {id:uid(),kind:'ai',emoji:'🖥️',name:'Full AI workstation',target:0,saved:0,date:'',source:'business',status:'saving'}
  ];
}

function freshState(){
  return {
    v:1,
    currency:'₱',
    family:[
      {id:uid(),name:'Dad',age:'32'},{id:uid(),name:'Mom',age:'31'},
      {id:uid(),name:'Kuya',age:'4'},{id:uid(),name:'Baby',age:'2 mos'}
    ],
    businesses:['Business 1','Business 2'],
    split:{tax:8, biz:15},            // % of every peso carved off before the family share
    salary:{method:'lowest', lookback:6, manual:0},
    efMonths:6,                        // full emergency fund target (irregular income: 6–12)
    starterMonths:1,                   // starter emergency fund, in months of essentials
    holdingStart:0,
    incomes:[],                        // {id,date,source,amount,note}
    moves:[],                          // {id,date,kind:'draw'|'sweep'|'debtpay'|'fund',to,amount,note}
    budget:defaultBudget(),
    spend:[],                          // {id,date,catId,amount,note}
    debts:[],                          // {id,name,balance,rate,min,start}
    strategy:'snowball',
    extraOverride:null,                // manual extra-to-debt per month, null = auto
    funds:{emergency:0, education:0, retirement:0},
    goals:{education:500000, retirement:0},
    protect:{},                        // checklist ticks
    dreams:defaultDreams(),            // {id,kind,emoji,name,target,saved,date:'YYYY-MM',source,status,...}
    started:todayISO()
  };
}

var S;
function load(){
  try{ var raw=localStorage.getItem(KEY); if(raw){ S=Object.assign(freshState(), JSON.parse(raw)); return; } }catch(e){}
  S=freshState();
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ toast('Could not save in this browser — export a backup.'); } }

/* --------------------------------------------------------------- helpers */

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function num(v){ var n=parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isFinite(n)?n:0; }
function money(n, dec){
  n=Math.round((+n||0)*(dec?100:1))/(dec?100:1);
  var s=Math.abs(n).toLocaleString('en-PH',{minimumFractionDigits:dec?2:0,maximumFractionDigits:dec?2:0});
  return (n<0?'−':'')+S.currency+s;
}
function pct(a,b){ return b>0?Math.max(0,Math.min(100,a/b*100)):(a>0?100:0); }
function sum(arr,f){ return arr.reduce(function(t,x){ return t+(f?f(x):x); },0); }
function barHTML(p, cls){ return '<div class="bar '+(cls||'')+'"><i style="width:'+p.toFixed(1)+'%"></i></div>'; }
function ring(p){
  var r=30, c=2*Math.PI*r, d=c*Math.max(0,Math.min(100,p))/100;
  return '<svg class="ring" viewBox="0 0 72 72" aria-hidden="true"><circle cx="36" cy="36" r="'+r+'" fill="none" stroke="var(--bar)" stroke-width="8"/>'+
    '<circle cx="36" cy="36" r="'+r+'" fill="none" stroke="var(--brand)" stroke-width="8" stroke-linecap="round" stroke-dasharray="'+d+' '+c+'" transform="rotate(-90 36 36)"/>'+
    '<text x="36" y="41" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)">'+Math.round(p)+'%</text></svg>';
}
var toastT;
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove('show');},2600); }

/* ------------------------------------------------------------ the maths */

// Split one income deposit into tax / business reinvest / family.
function splitOf(amount){
  var tax=amount*S.split.tax/100, biz=amount*S.split.biz/100;
  return {tax:tax, biz:biz, family:amount-tax-biz};
}
function incomeByMonth(){
  var m={};
  S.incomes.forEach(function(i){ var k=monthKey(i.date); m[k]=(m[k]||0)+num(i.amount); });
  return m;
}
// Family share per month over the look-back window (complete months before
// this one). Months with no income inside the window count as zero — that is
// exactly the lean month the salary has to survive.
function salaryWindow(){
  var byM=incomeByMonth(), keys=Object.keys(byM).sort(), cur=thisMonth(), out=[];
  if(!keys.length) return out;
  var first=keys[0];
  for(var i=S.salary.lookback;i>=1;i--){
    var k=addMonths(cur,-i); if(k<first) continue;
    out.push({m:k, family:splitOf(byM[k]||0).family});
  }
  if(!out.length) out.push({m:cur, family:splitOf(byM[cur]||0).family, partial:true});
  return out;
}
function suggestedSalary(){
  var w=salaryWindow(); if(!w.length) return 0;
  var vals=w.map(function(x){return x.family;});
  if(S.salary.method==='avg80') return Math.floor(sum(vals)/vals.length*0.8/100)*100;
  return Math.floor(Math.min.apply(null,vals)/100)*100;
}
function salary(){ return S.salary.method==='manual' ? num(S.salary.manual) : suggestedSalary(); }

function budgetTotal(filter){ return sum(S.budget.filter(filter||function(){return true;}), function(b){return num(b.amount);}); }
// A debt pays either a fixed monthly installment (min) or, for BNPL-style
// bills like SPayLater, an amount that differs per month (schedule).
function minFor(d, mk){ return d.schedule ? num(d.schedule[mk]) : num(d.min); }
// Next unpaid due date: this month if the day hasn't passed and it hasn't been
// paid yet, otherwise next month.
function nextDue(d){
  var t=todayISO(), cm=thisMonth();
  var mk=(+t.slice(8,10) <= (+d.due||1)) ? cm : addMonths(cm,1);
  while(paidFor(d,mk)) mk=addMonths(mk,1);
  var amt=Math.min(minFor(d,mk), num(d.balance));
  return {mk:mk, date:mk+'-'+pad(Math.min(+d.due||1, daysIn(mk))), amount:amt};
}
// Which due month a payment covers: its forMonth (set when paying), else the month it was paid in.
function payMonth(m){ return m.forMonth||monthKey(m.date); }
function paidFor(d,mk){ return S.moves.some(function(m){ return m.kind==='debtpay' && m.to===d.id && payMonth(m)===mk; }); }
function daysIn(mk){ return new Date(+mk.slice(0,4), +mk.slice(5,7), 0).getDate(); }
function debtMins(){ return sum(activeDebts(), function(d){ return nextDue(d).amount; }); }
// Stable group order = first appearance in the debt list; colour follows the group.
function debtGroups(){
  var order=[], by={};
  S.debts.forEach(function(d){ var g=d.group||'Other debts'; if(!by[g]){ by[g]=[]; order.push(g); } by[g].push(d); });
  return order.map(function(g,i){ return {name:g, slot:i<7?i+1:0, debts:by[g], total:sum(by[g],function(d){return Math.max(0,num(d.balance));})}; });
}
function essentials(){ return budgetTotal(function(b){return b.essential;}) + debtMins(); }
function activeDebts(){ return S.debts.filter(function(d){return num(d.balance)>0.5;}); }
function totalDebt(){ return sum(S.debts, function(d){return Math.max(0,num(d.balance));}); }
function totalDebtStart(){ return sum(S.debts, function(d){return Math.max(num(d.start),num(d.balance));}); }
// Zero-based: salary − planned spending − minimum payments = what's left to
// throw at the current step every month.
function leftover(){ return salary() - budgetTotal() - debtMins(); }
function extraToDebt(){ return S.extraOverride!=null ? num(S.extraOverride) : Math.max(0, leftover()); }

function holding(){
  var inflow=sum(S.incomes,function(i){return splitOf(num(i.amount)).family;});
  var out=sum(S.moves.filter(function(m){return m.kind==='draw'||m.kind==='sweep';}),function(m){return num(m.amount);});
  return num(S.holdingStart)+inflow-out;
}
function drawnThisMonth(){ var cm=thisMonth(); return sum(S.moves.filter(function(m){return m.kind==='draw'&&monthKey(m.date)===cm;}),function(m){return num(m.amount);}); }
function spentThisMonth(catId){
  var cm=thisMonth();
  return sum(S.spend.filter(function(s){return monthKey(s.date)===cm&&(!catId||s.catId===catId);}),function(s){return num(s.amount);});
}

// Month-by-month payoff simulation. Interest accrues on each balance, every
// debt gets its minimum, then the rest of the money (extra + minimums freed by
// debts already killed) goes to the target debt: smallest balance first
// (snowball) or highest rate first (avalanche).
//
// The monthly debt budget stays FIXED at next month's minimums + extra: when a
// debt dies (or a PayLater bill shrinks) its money rolls onto the next target.
// Month m of the simulation is calendar month thisMonth()+m.
function simulate(strategy, extra){
  var cm=thisMonth();
  var ds=activeDebts().map(function(d){return {id:d.id,name:d.name,src:d,bal:num(d.balance),rate:num(d.rate),paidOff:null,interest:0};});
  if(!ds.length) return {months:0, interest:0, debts:[], ok:true, timeline:[]};
  var budget=sum(ds,function(d){return minFor(d.src,addMonths(cm,1));})+extra, month=0, interest=0, timeline=[];
  while(ds.some(function(d){return d.bal>0.5;}) && month<600){
    month++;
    var mk=addMonths(cm,month), paid=0;
    var mins=sum(ds,function(d){return d.bal>0.5?Math.min(minFor(d.src,mk),d.bal):0;});
    var avail=Math.max(budget,mins);
    ds.forEach(function(d){ if(d.bal>0.5){ var i=d.bal*d.rate/1200; d.bal+=i; d.interest+=i; interest+=i; } });
    var minList=[], extraList=[];
    ds.forEach(function(d){ if(d.bal>0.5){ var p=Math.min(minFor(d.src,mk),d.bal,avail); if(p>0.005){ d.bal-=p; avail-=p; paid+=p; minList.push({name:d.name,amt:p,due:+d.src.due||0}); } } });
    var minTotal=paid;
    var order=ds.filter(function(d){return d.bal>0.5;}).sort(strategy==='avalanche'
      ? function(a,b){return b.rate-a.rate||a.bal-b.bal;}
      : function(a,b){return a.bal-b.bal||b.rate-a.rate;});
    var focus=order[0]?order[0].name:'';
    for(var k=0;k<order.length&&avail>0.005;k++){ var p2=Math.min(order[k].bal,avail); order[k].bal-=p2; avail-=p2; paid+=p2; extraList.push({name:order[k].name,amt:p2}); }
    var freed=[];
    ds.forEach(function(d){ if(d.bal<=0.5&&d.paidOff==null){ d.bal=0; d.paidOff=month; freed.push(d.name); } });
    minList.sort(function(a,b){return a.due-b.due;});
    timeline.push({mk:mk, paid:paid, minTotal:minTotal, mins:minList, extra:paid-minTotal, extras:extraList, bal:sum(ds,function(d){return d.bal;}), focus:focus, freed:freed});
  }
  var ok=!ds.some(function(d){return d.bal>0.5;});
  return {months:ok?month:Infinity, interest:interest, debts:ds, ok:ok, timeline:timeline};
}
// The payments one debt will ask for, month by month, from its next due
// month until the balance runs out (contract only, no snowball extra).
function projectDebt(d, limit){
  var out={}, bal=num(d.balance), mk=nextDue(d).mk, n=0;
  while(bal>0.5 && n<(limit||120)){
    if(paidFor(d,mk)){ mk=addMonths(mk,1); n++; continue; }   // paid ahead; balance already reflects it
    bal+=bal*num(d.rate)/1200;
    var a=Math.min(minFor(d,mk),bal);
    if(a>0.005){ out[mk]=a; bal-=a; }
    else if(!d.schedule) break;                       // no fixed payment: nothing to project
    else if(!Object.keys(d.schedule).some(function(k){return k>mk && num(d.schedule[k])>0;})) break;
    mk=addMonths(mk,1); n++;
  }
  return out;
}
// Months of payments: how many are left, how many the debt had in total.
// Null when the debt has no monthly payment (money owed to people).
function debtMonths(d){
  if(!d.schedule && num(d.min)<=0) return null;
  var proj=num(d.balance)>0.5?projectDebt(d,600):{}, keys=Object.keys(proj).sort(), left=keys.length, total;
  if(d.schedule) total=Object.keys(d.schedule).filter(function(k){return num(d.schedule[k])>0;}).length;
  else total=Math.ceil(Math.max(num(d.start),num(d.balance))/num(d.min)-0.001);
  total=Math.max(total,left);
  return {left:left, total:total, last:keys[keys.length-1]||null};
}
// Segmented progress: one slice per monthly payment, paid ones filled.
function sliceBar(total, done, color){
  if(total>72) return barHTML(pct(done,total),'good');
  var h='<div class="slices" role="img" aria-label="'+done+' of '+total+' monthly payments made">';
  for(var i=0;i<total;i++) h+='<i'+(i<done?' class="on"':'')+(color&&i<done?' style="background:'+color+'"':'')+'></i>';
  return h+'</div>';
}

// What the contracts alone demand each month (no snowball roll-over): shows
// when the installment load drops as loans and PayLater bills finish.
function contractual(n){
  var cm=thisMonth(), ds=activeDebts().map(function(d){return {src:d,bal:num(d.balance),rate:num(d.rate)};}), out=[];
  for(var m=1;m<=n;m++){
    var mk=addMonths(cm,m), paid=0;
    ds.forEach(function(d){ if(d.bal>0.5){ d.bal+=d.bal*d.rate/1200; var p=Math.min(minFor(d.src,mk),d.bal); d.bal-=p; paid+=p; } });
    out.push({mk:mk, v:paid});
  }
  return out;
}

function monthsBetween(a,b){ return (+b.slice(0,4)-+a.slice(0,4))*12+(+b.slice(5,7)-+a.slice(5,7)); }
function dreamDone(d){ return d.status==='bought' || (num(d.target)>0 && num(d.saved)>=num(d.target)); }
function openDreams(){ return (S.dreams||[]).filter(function(d){ return !dreamDone(d); }); }
// Next goal a sweep should feed: first unfinished one in the family's priority order.
function nextDream(){ return openDreams()[0]||null; }
function dreamLabel(d){ return (d.emoji?d.emoji+' ':'')+d.name; }

/* ----------------------------------------------------- roadmap (steps) */

var PROTECT=[
  ['philhealth','PhilHealth active for Dad & Mom (kids are covered as dependents)'],
  ['sss','SSS voluntary / self-employed contributions paid for both parents'],
  ['pagibig','Pag-IBIG contributions active (housing loan + MP2 access later)'],
  ['lifeDad','Term life insurance on Dad — at least 10× the family\'s yearly salary'],
  ['lifeMom','Term life insurance on Mom — her care work and income are worth insuring too'],
  ['hmo','Health cover / HMO for the kids (or a hospital fund inside the emergency fund)'],
  ['birth','Baby\'s PSA birth certificate & PhilHealth dependent registration done'],
  ['bir','Businesses registered with BIR; quarterly tax set-aside is in its own account'],
  ['accounts','Separate accounts: business ≠ holding tank ≠ family spending'],
  ['will','Guardian for the boys named and written down; both parents know all passwords & accounts']
];

function steps(){
  var ess=essentials(), sal=salary(), hold=holding(), ef=num(S.funds.emergency);
  var starter=Math.max(ess*S.starterMonths, 1);
  var full=Math.max(ess*S.efMonths, 1);
  var debt=totalDebt(), debtStart=totalDebtStart();
  var protDone=PROTECT.filter(function(p){return S.protect[p[0]];}).length;
  var edu=num(S.funds.education), eduGoal=Math.max(num(S.goals.education),1);
  var list=[
    {key:'setup', title:'Know your numbers', fund:null,
      why:'Log what the businesses earn, give every peso of the salary a job in the budget, and list every debt. You can\'t steer what you don\'t measure.',
      done: S.incomes.length>0 && budgetTotal()>0 && sal>0,
      progress: ((S.incomes.length>0)+(budgetTotal()>0)+(sal>0))/3*100,
      detail: (S.incomes.length?'✓':'○')+' income logged · '+(budgetTotal()>0?'✓':'○')+' budget filled · '+(sal>0?'✓':'○')+' salary set'},
    {key:'starter', title:'Starter emergency fund', fund:'emergency',
      why:'With a newborn and irregular income, one surprise can undo months of progress. Save '+S.starterMonths+' month'+(S.starterMonths>1?'s':'')+' of essentials first so emergencies don\'t become new debt.',
      done: ef>=starter, progress:pct(ef,starter), target:starter, have:ef,
      detail: money(ef)+' of '+money(starter)},
    {key:'debt', title:'Kill every consumer debt', fund:'debt',
      why:'Credit cards, personal loans, 5-6, gadget/appliance installments, salary loans. Pay minimums on all, throw every extra peso at one debt at a time.',
      done: debt<=0.5, progress: debtStart>0?pct(debtStart-debt,debtStart):(debt>0?0:100),
      detail: debt>0.5 ? money(debt)+' left of '+money(debtStart) : (S.debts.length?'All paid off 🎉':'No debts listed')},
    {key:'buffer', title:'One month ahead', fund:null,
      why:'Keep one full salary sitting in the holding tank. From now on, this month is paid for by last month\'s income — lean months stop being scary.',
      done: sal>0 && hold>=sal, progress:pct(hold,sal), target:sal, have:hold,
      detail: money(Math.max(0,hold))+' in tank of '+money(sal)+' target'},
    {key:'full', title:'Full emergency fund ('+S.efMonths+' months)', fund:'emergency',
      why:'Business income can dry up for a season. '+S.efMonths+' months of essentials means a bad quarter is an inconvenience, not a crisis.',
      done: ef>=full, progress:pct(ef,full), target:full, have:ef,
      detail: money(ef)+' of '+money(full)},
    {key:'protect', title:'Protect the family', fund:null,
      why:'Two young boys depend on both of you. Insurance and paperwork are what make every other step survivable.',
      done: protDone===PROTECT.length, progress:pct(protDone,PROTECT.length),
      detail: protDone+' of '+PROTECT.length+' done'},
    {key:'future', title:'Kids\' education + retirement', fund:'education',
      why:'Invest ~15% of income for retirement (SSS, PERA, Pag-IBIG MP2, index funds) and build college funds for both boys.',
      done: edu>=eduGoal, progress:pct(edu,eduGoal), target:eduGoal, have:edu,
      detail: 'Education '+money(edu)+' of '+money(eduGoal)+' · Retirement '+money(S.funds.retirement)},
    {key:'dreams', title:'Dream goals', fund:'dreams',
      why:'The house, the solar system, the AI workstation — paid with saved cash (the house with a sensible Pag-IBIG or bank loan), never with credit cards or installments. Runs side by side with step 7.',
      done: S.dreams.length>0 && !openDreams().length,
      progress: pct(sum(S.dreams,function(d){return d.status==='bought'?num(d.target):Math.min(num(d.saved),num(d.target));}), sum(S.dreams,function(d){return num(d.target);})),
      detail: S.dreams.filter(dreamDone).length+' of '+S.dreams.length+' funded'+(nextDream()?' · next: '+dreamLabel(nextDream()):'')}
  ];
  var cur=list.findIndex(function(s){return !s.done;});
  // Steps are sequential, except the last two: once the family is protected,
  // investing for the future and saving for dreams happen side by side.
  list.forEach(function(s,i){ s.state = s.done?'done':(i===cur||(s.key==='dreams'&&list[cur]&&list[cur].key==='future')?'now':'later'); });
  return {list:list, current: cur<0?null:list[cur], index:cur};
}
// Where money swept out of the holding tank should go right now.
function currentMoneyStep(){
  var st=steps().list;
  for(var i=0;i<st.length;i++){ if(!st[i].done && st[i].fund) return st[i]; }
  return null;
}

/* ------------------------------------------------------------ charts */

function slotColor(slot){ return 'var(--c'+(slot||0)+')'; }
function info(summary, body){ return '<details class="info"><summary>ⓘ '+summary+'</summary><div class="info-b">'+body+'</div></details>'; }
function tile(k,v,h,extra){ return '<div class="stat"'+(extra||'')+'><div class="k">'+k+'</div><div class="v">'+v+'</div>'+(h?'<div class="h">'+h+'</div>':'')+'</div>'; }

// Proportional stacked bar; every segment keeps a sliver so small debts show.
function stackBar(parts){
  var tot=sum(parts,function(p){return p.v;})||1;
  return '<div class="stack" role="img" aria-label="Share of total">'+parts.filter(function(p){return p.v>0;}).map(function(p){
    return '<i style="flex:'+p.v+' 1 0;background:'+p.color+'" data-tip="'+esc(p.label+' · '+money(p.v)+' · '+(p.v/tot*100).toFixed(1)+'%')+'"></i>';
  }).join('')+'</div>';
}
function legend(parts){
  var tot=sum(parts,function(p){return p.v;})||1;
  return '<div class="legend">'+parts.map(function(p){
    return '<div class="lg"><span class="sw" style="background:'+p.color+'"></span><span class="ln">'+esc(p.label)+'</span><span class="lv num">'+money(p.v)+'</span><span class="lp num">'+(p.v/tot*100).toFixed(p.v/tot<0.01?1:0)+'%</span></div>';
  }).join('')+'</div>';
}
function shortMoney(v){
  if(v>=1e6) return S.currency+(v/1e6).toFixed(v>=1e7?0:1).replace(/\.0$/,'')+'M';
  if(v>=1e3) return S.currency+Math.round(v/1e3)+'k';
  return S.currency+Math.round(v);
}
function barPath(x,y,w,h,r){ r=Math.min(r,h,w/2); return 'M'+x+','+(y+h)+'V'+(y+r)+'Q'+x+','+y+' '+(x+r)+','+y+'H'+(x+w-r)+'Q'+(x+w)+','+y+' '+(x+w)+','+(y+r)+'V'+(y+h)+'Z'; }

// Column chart: one series, rounded data-ends on the baseline, hover tips,
// values labelled only on the first and last column.
function barChart(pts, opts){
  opts=opts||{};
  var W=320,H=150,pt=18,pb=20,n=pts.length||1,slot=W/n,bw=Math.min(26,slot*0.62);
  var max=Math.max.apply(null,pts.map(function(p){return p.v;}).concat([opts.ref||0,1]));
  var y=function(v){return pt+(H-pt-pb)*(1-v/max);};
  var g='<line x1="0" x2="'+W+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" class="axis"/>';
  pts.forEach(function(p,i){
    var cx=slot*i+slot/2, top=y(p.v), h=Math.max(p.v>0?2:0,H-pb-top);
    g+='<g data-tip="'+esc(p.tip||p.label+': '+money(p.v))+'"><rect x="'+(slot*i)+'" y="0" width="'+slot+'" height="'+H+'" fill="transparent"/>'+
      (h>0?'<path d="'+barPath(cx-bw/2,H-pb-h,bw,h,4)+'" fill="'+(p.color||'var(--brand)')+'"/>':'')+
      '<text x="'+cx+'" y="'+(H-6)+'" text-anchor="middle" class="tl">'+esc(p.label)+'</text>'+
      ((i===0||i===n-1)&&p.v>0?'<text x="'+cx+'" y="'+(H-pb-h-5)+'" text-anchor="middle" class="tv">'+shortMoney(p.v)+'</text>':'')+'</g>';
  });
  if(opts.ref) g+='<line x1="0" x2="'+W+'" y1="'+y(opts.ref)+'" y2="'+y(opts.ref)+'" class="ref"/><text x="'+W+'" y="'+(y(opts.ref)-4)+'" text-anchor="end" class="tr">'+esc(opts.refLabel||'')+'</text>';
  return '<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(opts.aria||'Column chart')+'">'+g+'</svg>';
}

// Area chart with a crosshair: the series is stashed on the element and the
// pointer handler below finds the nearest point.
function areaChart(pts, aria){
  var W=320,H=150,pt=16,pb=20,n=pts.length;
  if(n<2) return '';
  var max=Math.max.apply(null,pts.map(function(p){return p.v;}).concat([1]));
  var xs=pts.map(function(p,i){return +(i/(n-1)*W).toFixed(1);}), ys=pts.map(function(p){return +(pt+(H-pt-pb)*(1-p.v/max)).toFixed(1);});
  var line=xs.map(function(x,i){return (i?'L':'M')+x+','+ys[i];}).join('');
  var mid=Math.floor((n-1)/2);
  return '<div class="lc" data-xs="'+xs.join(',')+'" data-ys="'+ys.join(',')+'" data-tips="'+esc(JSON.stringify(pts.map(function(p){return p.tip;})))+'">'+
    '<svg class="chart-svg" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(aria)+'">'+
    '<path d="'+line+'L'+W+','+(H-pb)+'L0,'+(H-pb)+'Z" class="area"/><path d="'+line+'" class="aline"/>'+
    '<line x1="0" x2="'+W+'" y1="'+(H-pb)+'" y2="'+(H-pb)+'" class="axis"/>'+
    '<text x="2" y="'+(pt-4)+'" class="tv" text-anchor="start">'+shortMoney(max)+'</text>'+
    '<text x="0" y="'+(H-5)+'" class="tl" text-anchor="start">'+esc(pts[0].label)+'</text>'+
    (n>4?'<text x="'+xs[mid]+'" y="'+(H-5)+'" class="tl" text-anchor="middle">'+esc(pts[mid].label)+'</text>':'')+
    '<text x="'+W+'" y="'+(H-5)+'" class="tl" text-anchor="end">'+esc(pts[n-1].label)+'</text>'+
    '<line class="xh" x1="0" x2="0" y1="'+pt+'" y2="'+(H-pb)+'" visibility="hidden"/><circle class="xd" r="4.5" cx="0" cy="0" visibility="hidden"/>'+
    '</svg></div>';
}

V.budget=function(){
  var sal=salary(), mins=debtMins(), plan=budgetTotal(), left=sal-plan-mins;
  var groups=[]; S.budget.forEach(function(b){ if(groups.indexOf(b.group)<0) groups.push(b.group); });
  var gt=groups.map(function(g){ return {g:g, v:budgetTotal(function(b){return b.group===g;}), s:sum(S.budget.filter(function(b){return b.group===g;}),function(b){return spentThisMonth(b.id);})}; });
  gt.push({g:'Debt payments', v:mins, s:0, debt:true});
  var max=Math.max.apply(null, gt.map(function(x){return x.v;}).concat([1]));

  var h='<div class="card"><h2>🧾 Where the salary goes</h2>'+
    '<div class="grid g3" style="margin:8px 0 12px">'+
      tile('Salary',shortMoney(sal))+tile('Planned',shortMoney(plan+mins))+
      tile(left>=0?'Left over':'Over',shortMoney(Math.abs(left)),'', ' style="border-color:'+(left>=0?'var(--good)':'var(--bad)')+'"')+'</div>'+
    gt.filter(function(x){return x.v>0;}).sort(function(a,b){return b.v-a.v;}).map(function(x){
      return '<div class="hb" data-tip="'+esc(x.g+': '+money(x.v)+' planned'+(x.s?' · '+money(x.s)+' spent':''))+'"><span class="hl">'+esc(x.g)+'</span>'+
        '<span class="ht"><i style="width:'+(x.v/max*100).toFixed(1)+'%;background:'+(x.debt?'var(--bad)':'var(--brand)')+'"></i>'+
        (x.s?'<em style="left:'+Math.min(100,x.s/max*100).toFixed(1)+'%"></em>':'')+'</span><span class="hv num">'+shortMoney(x.v)+'</span></div>';
    }).join('')+
    (plan===0?'<p class="muted">Fill in the amounts below to see the picture.</p>':'')+
    (left<0?'<div class="note bad">Spending more than the salary — trim wants first.</div>':'')+
    '</div>';

  // Categories as collapsible group cards, same pattern as the debts.
  groups.forEach(function(g){
    var items=S.budget.filter(function(b){return b.group===g;}), key='b:'+g;
    var gv=sum(items,function(b){return num(b.amount);}), gs=sum(items,function(b){return spentThisMonth(b.id);});
    h+='<details class="card grp" data-g="'+esc(key)+'"'+(openGroups[key]?' open':'')+'><summary><span class="gn">'+esc(g)+' <small>'+items.length+'</small></span>'+
      '<span class="gt num">'+money(gv)+'</span></summary>'+
      (gv>0?barHTML(pct(gs,gv),gs>gv?'bad':''):'')+

// Payments falling due in the next n days, soonest first.
function upcomingDues(n){
  var t=new Date(todayISO()+'T00:00:00'), lim=new Date(t.getTime()+n*864e5);
  return activeDebts().filter(function(d){return d.due;}).map(function(d){ var nd=nextDue(d); return {d:d, date:nd.date, amount:nd.amount}; })
    .filter(function(x){ var dt=new Date(x.date+'T00:00:00'); return x.amount>0.5 && dt>=t && dt<=lim; })
    .sort(function(a,b){return a.date.localeCompare(b.date)||b.amount-a.amount;});
}
// One row per due date; several payments on the same day fold into one
// expandable row so a busy 15th doesn't become ten lines.
function dueList(items){
  var t=new Date(todayISO()+'T00:00:00'), byDate=[], idx={};
  items.forEach(function(x){ if(idx[x.date]==null){ idx[x.date]=byDate.length; byDate.push({date:x.date,items:[]}); } byDate[idx[x.date]].items.push(x); });
  function badge(date){
    var dt=new Date(date+'T00:00:00'), days=Math.round((dt-t)/864e5);
    return {days:days, html:'<div class="dd'+(days<=2?' soon':'')+'"><b>'+dt.getDate()+'</b><span>'+monthLabel(date.slice(0,7)).split(' ')[0]+'</span></div>'};
  }
  function when(days){ return days===0?'today':days===1?'tomorrow':'in '+days+' days'; }
  return '<div class="dues">'+byDate.map(function(g){
    var bd=badge(g.date);
    if(g.items.length===1){
      var x=g.items[0];
      return '<div class="due">'+bd.html+'<div class="dn"><b>'+esc(x.d.name)+'</b><small>'+when(bd.days)+(x.d.group&&x.d.group!==x.d.name?' · '+esc(x.d.group):'')+'</small></div>'+
        '<div class="da num">'+money(x.amount)+'</div><button class="icon" data-act="pay" data-id="'+x.d.id+'">Pay</button></div>';
    }
    return '<details class="dueg"><summary class="due">'+bd.html+'<div class="dn"><b>'+g.items.length+' payments</b><small>'+when(bd.days)+' · '+esc(g.items.map(function(x){return x.d.name;}).join(', '))+'</small></div>'+
      '<div class="da num">'+money(sum(g.items,function(x){return x.amount;}))+'</div><span class="chev">›</span></summary>'+
      g.items.map(function(x){ return '<div class="due sub"><span></span><div class="dn"><b>'+esc(x.d.name)+'</b>'+(x.d.group&&x.d.group!==x.d.name?'<small>'+esc(x.d.group)+'</small>':'')+'</div><div class="da num">'+money(x.amount)+'</div><button class="icon" data-act="pay" data-id="'+x.d.id+'">Pay</button></div>'; }).join('')+
      '</details>';
  }).join('')+'</div>';
}

// Calendar of required payments. Past days show what was recorded as paid;
// from each debt's next due date on, the contract's projected payments.
var cal={view:'month', mk:null, day:null};
function duesInMonth(mk){
  var out=[], dim=daysIn(mk);
  S.debts.forEach(function(d){
    S.moves.forEach(function(m){ if(m.kind==='debtpay'&&m.to===d.id&&payMonth(m)===mk) out.push({d:d,date:m.forMonth&&d.due?mk+'-'+pad(Math.min(+d.due,dim)):m.date,amount:num(m.amount),paid:true}); });
    if(num(d.balance)<=0.5||!d.due) return;
    var a=projectDebt(d,120)[mk];
    if(a) out.push({d:d,date:mk+'-'+pad(Math.min(+d.due,dim)),amount:a,paid:false});
  });
  return out.sort(function(x,y){return x.date.localeCompare(y.date)||y.amount-x.amount;});
}
function groupColor(d){ var g=debtGroups().find(function(x){return x.name===(d.group||'Other debts');}); return slotColor(g?g.slot:0); }
function calendarCard(){

    var max=Math.max.apply(null,tots.map(function(t){return t.v;}).concat([1]));

      '<div class="yeargrid">'+tots.map(function(t){
        return '<button class="ym'+(t.mk===cm?' today':'')+'" data-calmonth="'+t.mk+'" data-tip="'+esc(monthLabel(t.mk,true)+': '+money(t.v)+' · '+t.n+' payments')+'">'+
          '<span class="heat" style="opacity:'+(t.v>0?(0.1+0.32*t.v/max).toFixed(2):0)+'"></span>'+
          (t.v>0?'<span class="ymbar" style="width:'+(t.v/max*100).toFixed(1)+'%"></span>':'')+
          '<span class="ymn">'+monthLabel(t.mk).split(' ')[0]+'</span><b class="num">'+(t.v?shortMoney(t.v):'—')+'</b>'+

      '<div class="row between num" style="margin-top:10px"><span class="muted">'+y+' total</span><b>'+money(sum(tots,function(t){return t.v;}))+'</b></div>';
    return h+'</div>';
  }
  var mk=cal.mk, list=duesInMonth(mk), byDay={};
  list.forEach(function(x){ var dd=+x.date.slice(8,10); (byDay[dd]=byDay[dd]||[]).push(x); });
  var first=new Date(+mk.slice(0,4), +mk.slice(5,7)-1, 1).getDay(), dim=daysIn(mk), today=todayISO();
  h+='<div class="calnav"><button class="icon" data-calnav="-1" aria-label="Previous month">‹</button><b>'+monthLabel(mk,true)+'</b><button class="icon" data-calnav="1" aria-label="Next month">›</button></div>'+
    '<div class="calgrid">'+['S','M','T','W','T','F','S'].map(function(w){return '<span class="wd">'+w+'</span>';}).join('');
  for(var i=0;i<first;i++) h+='<span></span>';
  for(var dd=1; dd<=dim; dd++){

      '<span class="cdn">'+dd+'</span>'+(items.length?'<span class="cda num">'+(allPaid?'✓':shortMoney(tot))+'</span><span class="cdd">'+dots.map(function(x){return '<i style="background:'+groupColor(x.d)+'"></i>';}).join('')+'</span>':'')+'</button>';

  h+='<div class="row between num" style="margin:10px 0 4px"><span class="muted">'+list.length+' payments in '+monthLabel(mk).split(' ')[0]+'</span><b>'+money(monthTot)+'</b></div>'+

          '<div class="da num">'+money(x.amount)+'</div>'+(x.paid?'<span class="pill good">Paid</span>':'<button class="icon" data-act="pay" data-id="'+x.d.id+'" data-mk="'+x.date.slice(0,7)+'">Pay</button>')+'</div>';
      }).join('')+'</div>';
  } else h+='<p class="muted" style="font-size:13px;margin:6px 0 0">Tap a day to see its payments.</p>';
  var noDue=activeDebts().filter(function(d){return !d.due;});
  if(noDue.length) h+='<small class="muted">Not on the calendar (no due date): '+esc(noDue.map(function(d){return d.name;}).join(', '))+'</small>';

  }));
  h+='<div class="card"><h2>Payoff plan</h2>'+

    '<label class="f" style="margin-top:10px"><span>Extra per month on top of required payments</span><input inputmode="decimal" data-bind="extraOverride" data-num data-nullable value="'+(S.extraOverride!=null?S.extraOverride:'')+'" placeholder="Auto from budget: '+money(Math.max(0,leftover()))+'"></label>'+
    '<div class="bigdate"><small>Debt-free</small><b>'+(sim.ok?monthLabel(addMonths(cm,sim.months),true):'Not yet')+'</b>'+

    function(v){ var a=num(v.amount); if(a<=0) return false;

      else if(v.to.indexOf('dream:')===0){ var g=S.dreams.find(function(x){return x.id===v.to.slice(6);}); if(!g) return false;
        g.saved=num(g.saved)+a; note='Sweep → '+dreamLabel(g); }
      else { S.funds[v.to]=num(S.funds[v.to])+a; note='Sweep → '+(opts.find(function(o){return o[0]===v.to;})||[0,v.to])[1]; }
      S.moves.push({id:uid(),date:todayISO(),kind:'sweep',to:v.to,amount:a,note:note}); }, 'Sweep');
};
ACT.undo=function(el){
  var m=S.moves.find(function(x){return x.id===el.dataset.id;}); if(!m) return;
  if(!confirm('Undo "'+(m.note||m.kind)+'" ('+money(m.amount)+')?')) return;
  if(m.kind==='debtpay'||(m.kind==='sweep'&&String(m.to).indexOf('debt:')===0)){
    var id=m.kind==='debtpay'?m.to:String(m.to).slice(5), d=S.debts.find(function(x){return x.id===id;}); if(d) d.balance=num(d.balance)+num(m.amount);
  } else if(m.kind==='dreamadd'||(m.kind==='sweep'&&String(m.to).indexOf('dream:')===0)){
    var g=S.dreams.find(function(x){return x.id===String(m.to).slice(6);}); if(g) g.saved=Math.max(0,num(g.saved)-num(m.amount));
  } else if(m.kind==='sweep'){ S.funds[m.to]=Math.max(0,num(S.funds[m.to])-num(m.amount)); }
  S.moves=S.moves.filter(function(x){return x!==m;}); save(); render();
};
ACT.dream=function(el){
  var id=el&&el.dataset.id, d=id?S.dreams.find(function(x){return x.id===id;}):null;
  var kind=d?d.kind:'other';
  openDialog(d?'Edit goal':'Add a goal',
    '<div class="grid" style="grid-template-columns:70px 1fr">'+field('emoji','Icon','maxlength="4"',d?d.emoji:'⭐')+field('name','Goal','required placeholder="e.g. Family car, Business van"',d?d.name:'')+'</div>'+
    (kind==='house'
      ? '<div class="grid g2">'+field('price','House price','inputmode="decimal"',d.price||'')+field('dpPct','Down payment %','inputmode="decimal"',d.dpPct||20)+'</div>'+
        '<p class="muted" style="font-size:13px">Leave "Target" blank to use down payment + 7% closing costs.</p>'
      : '')+
    '<div class="grid g2">'+field('target','Target amount','inputmode="decimal"'+(kind==='house'?'':' required'),d&&num(d.target)?d.target:'')+
      field('saved','Saved so far','inputmode="decimal"',d?d.saved:0)+'</div>'+
    '<div class="grid g2">'+field('date','Target month (optional)','type="month"',d?d.date:'')+
      selectField('source','Funded by',[['family','Family (after step 5)'],['business','Business reinvest share']],d?d.source:'family')+'</div>'+
    (kind==='solar'?field('billSave','Expected electricity savings per month','inputmode="decimal"',d.billSave||''):'')+
    (d&&d.status==='bought'?'<label class="check"><input type="checkbox" name="unbuy"><span>Not bought yet (undo "bought")</span></label>':'')+
    (d?'<button type="button" class="danger" data-del="dreams" data-id="'+d.id+'">Delete this goal</button>':''),
    function(v){
      var o={emoji:v.emoji,name:v.name||'Goal',target:num(v.target),saved:num(v.saved),date:v.date||'',source:v.source};
      if(kind==='house'){ o.price=num(v.price); o.dpPct=num(v.dpPct)||20; if(!o.target&&o.price) o.target=Math.round(o.price*(o.dpPct+7)/100); }
      if(kind==='solar') o.billSave=num(v.billSave);
      if(v.unbuy) o.status='saving';
      if(d) Object.assign(d,o); else S.dreams.push(Object.assign({id:uid(),kind:'other',status:'saving'},o));
    });
};
ACT.dreamadd=function(el){
  var d=S.dreams.find(function(x){return x.id===el.dataset.id;}); if(!d) return;
  var h=Math.max(0,holding()), rem=Math.max(0,num(d.target)-num(d.saved));
  openDialog('Add savings · '+dreamLabel(d),
    field('amount','Amount','inputmode="decimal" required',rem&&d.date?Math.ceil(rem/Math.max(1,monthsBetween(thisMonth(),d.date))/100)*100:'')+
    selectField('from','From',[['tank','Holding tank (has '+money(h)+')'],['business','Business reinvest money'],['other','Other savings / gift / windfall']],d.source==='business'?'business':'tank')+
    (!foundationDone()&&d.source!=='business'?'<div class="note warn">Your foundation isn\'t built yet — money for this goal would pay off debt or grow the emergency fund faster. Sure?</div>':''),
    function(v){ var a=num(v.amount); if(a<=0) return false;
      d.saved=num(d.saved)+a;
      S.moves.push({id:uid(),date:todayISO(),kind:v.from==='tank'?'sweep':'dreamadd',to:'dream:'+d.id,amount:a,
        note:(v.from==='tank'?'Sweep':v.from==='business'?'Business money':'Other savings')+' → '+dreamLabel(d)});
      toast(dreamDone(d)?'🎉 '+d.name+' is fully saved!':money(d.saved)+' saved for '+d.name); }, 'Add');
};
ACT.dreambought=function(el){
  var d=S.dreams.find(function(x){return x.id===el.dataset.id;}); if(!d) return;
  if(!confirm('Mark "'+d.name+'" as bought? 🎉')) return;
  d.status='bought'; save(); render(); toast('Congratulations! 🎉');
};
ACT.dreammove=function(el){
  var i=S.dreams.findIndex(function(x){return x.id===el.dataset.id;}), j=i+(+el.dataset.dir);
  if(i<0||j<0||j>=S.dreams.length) return;
  var t=S.dreams[i]; S.dreams[i]=S.dreams[j]; S.dreams[j]=t; save(); render();
};
ACT.addcat=function(){
  var groups=[]; S.budget.forEach(function(b){ if(groups.indexOf(b.group)<0) groups.push(b.group); });
  openDialog('Add budget category',
    field('name','Category','required')+
    field('group','Group','list="grpList" required',groups[0]||'Home')+'<datalist id="grpList">'+groups.map(function(g){return '<option value="'+esc(g)+'">';}).join('')+'</datalist>'+
    field('amount','Monthly amount','inputmode="decimal"')+
    '<label class="check"><input type="checkbox" name="essential" checked><span>Essential (a "need", not a "want")</span></label>',
    function(v){ S.budget.push({id:uid(),name:v.name,group:v.group||'Other',amount:num(v.amount),essential:!!v.essential}); });
};
ACT.addfam=function(){ S.family.push({id:uid(),name:'',age:''}); save(); render(); };
ACT.addbiz=function(){ S.businesses.push('Business '+(S.businesses.length+1)); save(); render(); };
ACT.export=function(){
  // Inside the Android app the WebView can't download blobs; hand the JSON to
  // the native side, which opens the system "save as" picker.
  if(window.AndroidBridge){ AndroidBridge.saveFile('family-budget-backup-'+todayISO()+'.json', JSON.stringify(S,null,2)); return; }
  var blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='family-budget-backup-'+todayISO()+'.json';
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
};
ACT.import=function(){ document.getElementById('importFile').click(); };
ACT.print=function(){ if(window.AndroidBridge) AndroidBridge.print(); else window.print(); };
ACT.reset=function(){ if(confirm('Erase ALL data on this device? Export a backup first if you might need it.')){ S=freshState(); save(); tab='home'; render(); } };
ACT.sample=function(){
  // Illustrative numbers only, so the family can see how every screen works.
  var cm=thisMonth(), b=['Online store','Food stall'];
  S.businesses=b.slice();
  var pattern=[[85000,30000],[98000,28000],[80000,30000],[110000,32000],[90000,26000],[102000,31000],[60000,15000]];
  pattern.forEach(function(p,i){ var m=addMonths(cm,-(6-i)); S.incomes.push({id:uid(),date:m+'-15',source:b[0],amount:p[0],note:'sample'},{id:uid(),date:m+'-20',source:b[1],amount:p[1],note:'sample'}); });
  var amounts={'Rent / house amortization':9000,'Electricity':3500,'Water':600,'Internet & mobile load':1700,'LPG / cooking gas':1100,
    'Groceries & palengke':12000,'Rice':2400,'Drinking water':600,'Formula / milk':4500,'Diapers & wipes':2800,'Pedia check-ups & vaccines':1500,
    'Baby clothes & essentials':800,'Preschool tuition & supplies':3000,'Milk, snacks & baon':1500,'Clothes & shoes':500,'Fuel / fare':3500,
    'Vehicle maintenance & registration':800,'PhilHealth (both parents)':1000,'SSS voluntary (both parents)':1400,'Pag-IBIG':400,
    'HMO / life insurance premiums':1500,'Medicines & vitamins':800,'Church / tithes':1000,'Support for parents / relatives':2000,
    'Eating out & food delivery':1500,'Family outings':1000,'Dad personal allowance':1000,'Mom personal allowance':1000,'Subscriptions (Netflix, Spotify, etc.)':300};
  S.budget.forEach(function(x){ if(amounts[x.name]!=null) x.amount=amounts[x.name]; });

    {id:uid(),group:'Bank',name:'Personal loan (bank)',balance:120000,start:120000,rate:22,min:5200,due:20},

  ];

  });
  // The family has been paying itself the salary each past month.

/* -------------------------------------------------------------- binding */

function setPath(path,val){ var p=path.split('.'), o=S; for(var i=0;i<p.length-1;i++) o=o[p[i]]; o[p[p.length-1]]=val; }

var rerenderT;
document.addEventListener('change',function(e){
  var el=e.target;
  if(el.id==='importFile'&&el.files[0]){
    var r=new FileReader(); r.onload=function(){
      try{
        var d=JSON.parse(r.result);
        if(d&&d.kind==='family-budget-debts'&&Array.isArray(d.debts)){
          // A debt list only: replaces the debts, leaves income/budget/goals alone.
          if(S.debts.length&&!confirm('Replace your '+S.debts.length+' debts with the '+d.debts.length+' in this file?')) return;
          S.debts=d.debts.map(function(x){ return Object.assign({id:uid(),rate:0,min:0,due:'',schedule:null,note:'',group:''},x,{start:Math.max(num(x.start),num(x.balance))}); });
          save(); tab='debts'; render(); toast(d.debts.length+' debts imported'); return;
        }
        if(!d||!Array.isArray(d.budget)) throw 0; S=Object.assign(freshState(),d); save(); render(); toast('Backup restored');
      }
      catch(err){ toast('That file is not a valid backup'); }
    }; r.readAsText(el.files[0]); el.value=''; return;
  }
  if(el.id==='themeSel'){ applyTheme(el.value); try{ localStorage.setItem(KEY+'.theme',el.value); }catch(err){} return; }
  if(el.dataset.bind){
    var v=el.value;
    if(el.hasAttribute('data-nullable')&&String(v).trim()==='') v=null;
    else if(el.hasAttribute('data-num')) v=num(v);
    setPath(el.dataset.bind,v); save(); render(); return;
  }
  if(el.dataset.protect){ S.protect[el.dataset.protect]=el.checked; save(); render(); return; }
  if(el.dataset.biz!=null){ S.businesses[+el.dataset.biz]=el.value; save(); return; }
  if(el.dataset.edit){
    var item=S[el.dataset.edit].find(function(x){return x.id===el.dataset.id;}); if(!item) return;
    item[el.dataset.f]= el.type==='checkbox'?el.checked : el.hasAttribute('data-num')?num(el.value):el.value;
    save();
    // Re-render totals without yanking focus away from the next input.
    clearTimeout(rerenderT); rerenderT=setTimeout(function(){ var a=document.activeElement, sel=a&&a.dataset&&a.dataset.id&&a.dataset.f?'[data-id="'+a.dataset.id+'"][data-f="'+a.dataset.f+'"]':null; render(); if(sel){ var n=document.querySelector(sel); if(n) n.focus(); } },0);
  }
});
document.addEventListener('click',function(e){
  var el=e.target.closest('button,[data-go]'); if(!el) return;
  if(el.dataset.tab){ go(el.dataset.tab); return; }
  if(el.dataset.cal){ cal.view=el.dataset.cal; render(); return; }
  if(el.dataset.calnav){ cal.mk=addMonths(cal.mk,+el.dataset.calnav); cal.day=null; render(); return; }
  if(el.dataset.calmonth){ cal.mk=el.dataset.calmonth; cal.view='month'; cal.day=null; render(); return; }
  if(el.dataset.calday){ cal.day=el.dataset.calday; render(); return; }
  if(el.dataset.strategy){ S.strategy=el.dataset.strategy; save(); render(); return; }
  if(el.dataset.go){ go(el.dataset.go); return; }
  if(el.dataset.act&&ACT[el.dataset.act]){ e.preventDefault(); ACT[el.dataset.act](el); return; }
  if(el.dataset.delbiz!=null){ S.businesses.splice(+el.dataset.delbiz,1); save(); render(); return; }
  if(el.dataset.del){
    var coll=el.dataset.del;
    if(coll==='budget'&&S.spend.some(function(s){return s.catId===el.dataset.id;})&&!confirm('This category has logged spending. Delete anyway?')) return;
    if(coll==='debts'&&!confirm('Delete this debt?')) return;
    if(coll==='dreams'&&!confirm('Delete this goal and its saved amount?')) return;
    S[coll]=S[coll].filter(function(x){return x.id!==el.dataset.id;});
    if(dlg.open) dlg.close();
    save(); render();
  }
});

function go(t){ tab=t; render(); window.scrollTo(0,0); }

// Tooltips: hover on desktop, tap on phones. Line charts get a crosshair.
var tipEl=document.getElementById('tip'), tipT;
function showTip(text,x,y){
  tipEl.textContent=text; tipEl.classList.add('show');
  var w=tipEl.offsetWidth, hgt=tipEl.offsetHeight;
  tipEl.style.left=Math.max(8,Math.min(window.innerWidth-w-8,x-w/2))+'px';
  tipEl.style.top=Math.max(8,y-hgt-14)+'px';
  clearTimeout(tipT); tipT=setTimeout(hideTip,3000);
}
function hideTip(){ tipEl.classList.remove('show'); document.querySelectorAll('.lc .xh,.lc .xd').forEach(function(e){e.setAttribute('visibility','hidden');}); }
function onPoint(e){
  var lc=e.target.closest&&e.target.closest('.lc');
  if(lc){
    var svg=lc.querySelector('svg'), r=svg.getBoundingClientRect(), xs=lc.dataset.xs.split(',').map(Number), ys=lc.dataset.ys.split(',').map(Number);
    var vx=(e.clientX-r.left)/r.width*320, i=0;
    for(var k=1;k<xs.length;k++) if(Math.abs(xs[k]-vx)<Math.abs(xs[i]-vx)) i=k;
    var xh=lc.querySelector('.xh'), xd=lc.querySelector('.xd');
    xh.setAttribute('x1',xs[i]); xh.setAttribute('x2',xs[i]); xh.setAttribute('visibility','visible');
    xd.setAttribute('cx',xs[i]); xd.setAttribute('cy',ys[i]); xd.setAttribute('visibility','visible');
    showTip(JSON.parse(lc.dataset.tips)[i], r.left+xs[i]/320*r.width, r.top+ys[i]/320*r.width);
    return;
  }
  var t=e.target.closest&&e.target.closest('[data-tip]');
  if(t) showTip(t.getAttribute('data-tip'), e.clientX, e.clientY); else if(e.type==='pointerdown') hideTip();
}
document.addEventListener('toggle',function(e){ var g=e.target.dataset&&e.target.dataset.g; if(g!=null) openGroups[g]=e.target.open; },true);
document.addEventListener('pointermove',function(e){ if(e.pointerType==='mouse') onPoint(e); });
document.addEventListener('pointerdown',onPoint);
document.addEventListener('pointerleave',hideTip);
window.addEventListener('scroll',hideTip,{passive:true});
// Android Back button: close a dialog, then return to Home, then exit.
window.__appBack=function(){
  if(dlg.open){ dlg.close(); return true; }
  if(tab!=='home'){ go('home'); return true; }
  return false;
};
function applyTheme(v){ if(v) document.documentElement.setAttribute('data-theme',v); else document.documentElement.removeAttribute('data-theme'); }

function render(){
  document.querySelectorAll('nav.tabs button').forEach(function(b){ b.setAttribute('aria-selected', String(b.dataset.tab===tab)); });
  document.getElementById('view').innerHTML=V[tab]();
  var st=steps();
  document.getElementById('hdrSub').textContent=new Date().toLocaleDateString('en-PH',{weekday:'short',month:'long',day:'numeric'});
  document.getElementById('hdrStep').textContent=st.current?'Step '+(st.index+1)+'/'+st.list.length+' ›':'🎉 Done';
  document.getElementById('hdrStep').title=st.current?st.current.title:'';
  var ts=document.getElementById('themeSel'); if(ts){ try{ ts.value=localStorage.getItem(KEY+'.theme')||''; }catch(e){} }
}

load();
try{ applyTheme(localStorage.getItem(KEY+'.theme')||''); }catch(e){}
render();
})();
</script>
